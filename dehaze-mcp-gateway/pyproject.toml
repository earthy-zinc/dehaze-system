[project]
name = "dehaze-mcp-gateway"
version = "1.0.0"
description = "MCP 工具：读取后端 OpenAPI，自动注册为 MCP tool，供大模型调用后端 API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]
