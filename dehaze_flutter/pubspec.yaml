name: dehaze_flutter
description: "A new Flutter project."
# 防止通过 `flutter pub publish` 意外发布到 pub.dev。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2
  flutter: ">=3.35.0"
  
dependencies:
  flutter:
    sdk: flutter

  # 使用 CupertinoIcons 类获取 iOS 风格的图标
  cupertino_icons: ^1.0.8

  # 用于导航的 Go Router
  go_router: ^17.0.0

  # 用于本地存储的共享偏好设置
  shared_preferences: ^2.3.5

  # 用于状态管理和依赖注入的 Riverpod
  flutter_riverpod: ^2.6.1

  # HTTP 客户端
  dio: ^5.7.0

  # 网络连接
  connectivity_plus: ^7.0.0

  # 日志记录
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 包含了一组推荐的代码检查规则，
  flutter_lints: ^6.0.0

flutter:

  # 确保可以使用 material Icons 类中的图标。
  uses-material-design: true

  # 字体配置
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
