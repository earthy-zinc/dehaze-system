name: dehaze_flutter
description: "图像去雾系统 Flutter 客户端，支持 iOS/Android/Web/Desktop 全平台。"
# 防止通过 `flutter pub publish` 意外发布到 pub.dev。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2
  flutter: ">=3.35.0"

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.0.0
  image: ^4.2.0
  image_picker: ^1.1.2
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5

dev_dependencies:
  build_runner: ^2.4.11
  build_test: ^2.1.7
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.8.0
  mockito: ^5.4.4

flutter:

  # 确保可以使用 material Icons 类中的图标。
  uses-material-design: true

  # 字体配置
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700