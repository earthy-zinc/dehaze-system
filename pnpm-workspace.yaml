packages:
  - dehaze-doc
  - dehaze-sdk-js
  - dehaze-uniapp
  - dehaze-taro
  - dehaze-front-vue
  - dehaze-front-react

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  bufferutil: true
  core-js: true
  core-js-pure: true
  electron: true
  electron-winstaller: true
  es5-ext: true
  esbuild: true
  msw: true
  unrs-resolver: true
  utf-8-validate: true
  vue-demi: true

overrides:
  '@tarojs/webpack5-prebundle>enhanced-resolve': 5.17.1
  '@vue/server-renderer': 3.5.39
  stylelint-config-recommended: ^17.0.0
  '@types/react': ^19.2.3
  '@types/react-dom': ^19.2.3

patchedDependencies:
  '@tarojs/vite-runner@4.2.1': dehaze-taro/patches/@tarojs__vite-runner@4.2.1.patch
