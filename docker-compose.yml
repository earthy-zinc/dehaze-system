networks:
  pei-network:
    driver: bridge

services:
  # MySQL
  mysql:
    image: mysql:8.4.5
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DEHAZE_PASSWORD}
      - MYSQL_DATABASE=dehaze
      - TZ=Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-logs:/var/log/mysql
      - ./config/mysql:/etc/mysql/conf.d:ro
      - ./config/sql/schema:/docker-entrypoint-initdb.d:ro
      - ./config/sql/data:/docker-init-data:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --init-connect=SET NAMES utf8mb4
    privileged: true
    networks:
      - pei-network

  # Redis
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${DEHAZE_PASSWORD}",
      ]
    privileged: true
    networks:
      - pei-network

  # MongoDB
  mongodb:
    image: mongo:8.3.7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - mongo-logs:/var/log/mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${DEHAZE_PASSWORD}
      - MONGO_INITDB_DATABASE=admin
      - TZ=Asia/Shanghai
      - LANG=zh_CN.UTF-8
    networks:
      - pei-network

  # MinIO
  # 用于后端文件上传功能（用户上传的去雾结果等），端口 9110/9190
  # 数据集原始文件的浏览通过下面的 nginx 静态服务提供（端口 9000）
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9110:9000"
      - "9190:9090"
    environment:
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=${DEHAZE_PASSWORD}
      - MINIO_BROWSER_DEFAULT_LOCALE=zh_CN
      # 开放内置 Prometheus 指标端点 /minio/v2/metrics/cluster（免鉴权，仅内网采集）
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    volumes:
      - minio-data:/data
    command: server /data --console-address :9090 --address :9000
    privileged: true
    networks:
      - pei-network

  # Nginx 静态文件服务
  # 通过项目根目录下的 datasets、models 符号链接（指向 D:\DeepLearning）统一管理数据
  # 数据集图片 URL：http://{DEHAZE_HOST}:9000/datasets/{dataset_path}/{subdir}/{filename}
  # 模型权重 URL：http://{DEHAZE_HOST}:9000/models/{algorithm_path}
  nginx-dataset:
    image: nginx:alpine
    container_name: nginx-dataset
    restart: always
    ports:
      - "9000:80"
    volumes:
      - ./datasets:/usr/share/nginx/html/datasets:ro
      - ./models:/usr/share/nginx/html/models:ro
      - ./config/nginx/dataset.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pei-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: always
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
      # 启用 rabbitmq_prometheus 插件（15692 端口暴露指标）
      - ./config/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "15672:15672"
      - "5672:5672"
      - "15692:15692"
    environment:
      - RABBITMQ_DEFAULT_USER=root
      - RABBITMQ_DEFAULT_PASS=${DEHAZE_PASSWORD}
      - TZ=Asia/Shanghai
    networks:
      - pei-network

  # ES 插件初始化（一次性）：安装 analysis-ik 中文分词插件（幂等，已安装则跳过）
  es-plugin-init:
    image: alpine:3.20
    container_name: es-plugin-init
    command: >
      sh -c "if [ ! -d /usr/share/elasticsearch/plugins/analysis-ik ]; then
        apk add --no-cache curl unzip &&
        curl -fsSL -o /tmp/ik.zip https://get.infini.cloud/elasticsearch/analysis-ik/8.18.2 &&
        unzip -q /tmp/ik.zip -d /usr/share/elasticsearch/plugins/analysis-ik &&
        rm -f /tmp/ik.zip;
      fi"
    volumes:
      - es-plugins:/usr/share/elasticsearch/plugins
    networks:
      - pei-network
    restart: "no"

  # ElasticSearch
  elasticsearch:
    image: elasticsearch:8.18.2
    container_name: elasticsearch
    restart: unless-stopped
    depends_on:
      es-plugin-init:
        condition: service_completed_successfully
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - node.name=elasticsearch
      - ELASTIC_PASSWORD=${DEHAZE_PASSWORD}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      # 启用 xpack 安全：elastic 超级用户密码 = ELASTIC_PASSWORD
      # 保持 http（关闭 ssl），避免 kibana/logstash/skywalking 还要配 https + 证书
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - TZ=Asia/Shanghai
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-logs:/usr/share/elasticsearch/logs
      - es-plugins:/usr/share/elasticsearch/plugins
    networks:
      - pei-network

  kibana:
    image: kibana:8.18.2
    container_name: kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    depends_on:
      # kibana在elasticsearch启动之后再启动
      - elasticsearch
    environment:
      #设置系统语言文中文
      I18N_LOCALE: zh-CN
      TZ: Asia/Shanghai
      # ES 启用 security 后，kibana 必须用 kibana_system 系统账号（elastic 超级用户被禁用）
      # 首次部署需执行：bash scripts/init-security.sh 设置系统用户密码
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${DEHAZE_PASSWORD}
      # 访问域名
      # SERVER_PUBLICBASEURL: https://kibana.cloud.com
    volumes:
      - kibana-config:/usr/share/kibana/config
    networks:
      - pei-network

  logstash:
    image: logstash:8.18.2
    container_name: logstash
    restart: unless-stopped
    ports:
      - "4560:4560"
      # Beats 输入端口（Filebeat 日志采集）
      - "5044:5044"
    environment:
      # 供 pipeline 引用（dehaze.conf 中 ${ELASTIC_USER} / ${ELASTIC_PASSWORD}）
      # 用 logstash_system 系统账号（elastic 超级用户不推荐）
      # 首次部署需执行：bash scripts/init-security.sh 设置系统用户密码
      ELASTIC_USER: logstash_system
      ELASTIC_PASSWORD: ${DEHAZE_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ./config/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./config/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on:
      - elasticsearch
    networks:
      - pei-network

  # Filebeat（采集三端 JSON 结构化日志 → Logstash）
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.18.2
    container_name: filebeat
    restart: unless-stopped
    user: root
    # 部分云内核（如腾讯云）/proc/stat 的 processes 计数溢出为负数，go-sysinfo 解析失败
    # 导致 filebeat 无法启动；entrypoint 将清洗后的快照 bind 到容器内 /proc/stat 规避
    # （compose 直接挂载 /proc/stat 在 runc 下不稳定）。宿主机内核正常时可移除该 mount
    # 命令、cap_add 及 proc-stat 卷。重新生成快照：
    #   sed -E 's/^(processes|procs_running|procs_blocked) -?[0-9]+/\1 0/' /proc/stat > config/filebeat/proc-stat
    cap_add:
      - SYS_ADMIN
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mount --bind /usr/share/filebeat/proc-stat /proc/stat 2>/dev/null || true; exec /usr/bin/tini -- /usr/local/bin/docker-entrypoint filebeat -e --strict.perms=false"
    volumes:
      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./dehaze-java/logs:/logs/java:ro
      - ./dehaze-python/logs:/logs/python:ro
      - ./dehaze-go/logs:/logs/go:ro
      - filebeat-data:/usr/share/filebeat/data
      - ./config/filebeat/proc-stat:/usr/share/filebeat/proc-stat:ro
    depends_on:
      - logstash
    networks:
      - pei-network

  sky-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: sky-oap
    restart: unless-stopped
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx512m
      #记录数据的有效期，单位天
      - SW_CORE_RECORD_DATA_TTL=7
      #分析指标数据的有效期，单位天
      - SW_CORE_METRICS_DATA_TTL=7
      - SW_STORAGE=elasticsearch
      - SW_STORAGE_ES_CLUSTER_NODES=elasticsearch:9200
      - SW_STORAGE_ES_HTTP_PROTOCOL=HTTP
      - SW_ES_USER=elastic
      - SW_ES_PASSWORD=${DEHAZE_PASSWORD}
      - TZ=Asia/Shanghai
    depends_on:
      - elasticsearch
    networks:
      - pei-network

  sky-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: sky-ui
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      SW_SERVER_PORT: 18080
      SW_OAP_ADDRESS: http://sky-oap:12800
      TZ: Asia/Shanghai
    depends_on:
      - sky-oap
    networks:
      - pei-network

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.3.0
    container_name: xxl-job-admin
    restart: always
    ports:
      - "14980:8080"
    environment:
      - PARAMS=--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=${DEHAZE_PASSWORD} --xxl.job.accessToken=${DEHAZE_PASSWORD}
      - JAVA_OPTS=-Xmx512m
    volumes:
      - xxl-job-logs:/data/applogs
    depends_on:
      - mysql
    networks:
      - pei-network

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9091:9091"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.tpl:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # 启动时将 prometheus.tpl 中的 __ALERTMANAGER_PASSWORD__ 占位符替换为 ${DEHAZE_PASSWORD}
    # 生成 /etc/prometheus/prometheus.yml，再启动 prometheus（prometheus.yml 不支持环境变量）
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sed 's/__ALERTMANAGER_PASSWORD__/${DEHAZE_PASSWORD}/g' /etc/prometheus/prometheus.tpl > /etc/prometheus/prometheus.yml && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --web.listen-address=:9091"
    networks:
      - pei-network

  # AlertManager（告警通知，阈值规则见 config/prometheus/rules/）
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      # 部署前需将文件中的 SMTP 占位配置替换为真实值
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Basic Auth 凭证（bcrypt，账号 admin / 密码 ${DEHAZE_PASSWORD}）
      # 首次部署需执行：bash scripts/init-security.sh 生成 web.yml
      - ./config/alertmanager/web.yml:/etc/alertmanager/web_auth.yml:ro
      - alertmanager-data:/alertmanager
    command: --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager --web.config.file=/etc/alertmanager/web_auth.yml
    networks:
      - pei-network

  # Grafana (监控可视化)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "13001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${DEHAZE_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - pei-network

  # Node Exporter (宿主机 CPU/内存/磁盘指标)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - pei-network

  # MySQL Exporter
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=root:${DEHAZE_PASSWORD}
    networks:
      - pei-network

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${DEHAZE_PASSWORD}
    networks:
      - pei-network

  # MongoDB Exporter
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongodb-exporter
    restart: unless-stopped
    ports:
      - "9216:9216"
    environment:
      - MONGODB_URI=mongodb://root:${DEHAZE_PASSWORD}@mongodb:27017
    networks:
      - pei-network

  # GPU DCGM Exporter（算法服务 GPU 推理监控）
  # 依赖 NVIDIA GPU + nvidia-container-toolkit，通过 gpu profile 按需启动：
  #   docker compose --profile gpu up -d dcgm-exporter
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.0-3.4.0-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    profiles:
      - gpu
    ports:
      - "9400:9400"
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - pei-network

volumes:
  mysql-data:
  mysql-logs:
  redis-data:
  mongo-data:
  mongo-config:
  mongo-logs:
  minio-data:
  es-data:
  es-logs:
  es-plugins:
  kibana-config:
  rabbitmq-data:
  rabbitmq-logs:
  xxl-job-logs:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  filebeat-data:
