networks:
  pei-network:
    driver: bridge

services:
  # MySQL
  mysql:
    image: mysql:8.4.5
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DEHAZE_PASSWORD}
      - MYSQL_DATABASE=dehaze
      - TZ=Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-logs:/var/log/mysql
      - mysql-config:/etc/mysql/conf.d
      - ./config/sql/schema:/docker-entrypoint-initdb.d:ro
      - ./config/sql/data:/docker-init-data:ro
    command: --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    privileged: true
    networks:
      - pei-network

  # Redis
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${DEHAZE_PASSWORD}",
      ]
    privileged: true
    networks:
      - pei-network

  # MongoDB
  mongodb:
    image: bitnami/mongodb:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - mongo-logs:/var/log/mongodb
    environment:
      - MONGODB_ROOT_USER=root
      - MONGODB_ROOT_PASSWORD=${DEHAZE_PASSWORD}
      - MONGODB_DATABASE=admin
    networks:
      - pei-network

  # MinIO
  # 用于后端文件上传功能（用户上传的去雾结果等），端口 9110/9190
  # 数据集原始文件的浏览通过下面的 nginx 静态服务提供（端口 9000）
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9110:9000"
      - "9190:9090"
    environment:
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=${DEHAZE_PASSWORD}
      - MINIO_BROWSER_DEFAULT_LOCALE=zh_CN
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    command: server /data --console-address :9090 --address :9000
    privileged: true
    networks:
      - pei-network

  # Nginx 静态文件服务
  # 通过项目根目录下的 datasets、models 符号链接（指向 D:\DeepLearning）统一管理数据
  # 数据集图片 URL：http://127.0.0.1:9000/datasets/{dataset_path}/{subdir}/{filename}
  # 模型权重 URL：http://127.0.0.1:9000/models/{algorithm_path}
  nginx-dataset:
    image: nginx:alpine
    container_name: nginx-dataset
    restart: always
    ports:
      - "9000:80"
    volumes:
      - ./datasets:/usr/share/nginx/html/datasets:ro
      - ./models:/usr/share/nginx/html/models:ro
      - ./config/nginx/dataset.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pei-network

  # ElasticSearch
  elasticsearch:
    image: elasticsearch:8.18.2
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - node.name=elasticsearch
      - ELASTIC_PASSWORD=${DEHAZE_PASSWORD}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - TZ=Asia/Shanghai
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-logs:/usr/share/elasticsearch/logs
      - es-plugins:/usr/share/elasticsearch/plugins
    networks:
      - pei-network

  kibana:
    image: kibana:8.18.2
    container_name: kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    depends_on:
      # kibana在elasticsearch启动之后再启动
      - elasticsearch
    environment:
      #设置系统语言文中文
      I18N_LOCALE: zh-CN
      # 访问域名
      # SERVER_PUBLICBASEURL: https://kibana.cloud.com
    volumes:
      - kibana-config:/usr/share/kibana/config
    networks:
      - pei-network

  logstash:
    image: logstash:8.18.2
    container_name: logstash
    restart: unless-stopped
    ports:
      - "4560:4560"
    volumes:
      - logstash-pipeline:/usr/share/logstash/pipeline
      - logstash-config:/usr/share/logstash/config
    depends_on:
      - elasticsearch
    networks:
      - pei-network

  # Nacos Server
  nacos:
    image: nacos/nacos-server:latest
    container_name: nacos
    restart: unless-stopped
    volumes:
      - nacos-logs:/root/nacos/logs
    environment:
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=2222
      - NACOS_AUTH_IDENTITY_VALUE=2xxx
      - NACOS_AUTH_TOKEN=VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
      - NACOS_CONSOLE_PORT=10848
      - JVM_XMS=128m
      - JVM_XMX=256m
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=${DEHAZE_PASSWORD}
      - MYSQL_DATABASE_NUM=1
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    ports:
      - "8848:8848"
      - "9848:9848"
      - "10848:10848"
    networks:
      - pei-network
    depends_on:
      - mysql

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=root
      - RABBITMQ_DEFAULT_PASS=${DEHAZE_PASSWORD}
    networks:
      - pei-network

  rocketmq-namesrv:
    image: apache/rocketmq:latest
    container_name: rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT: -server -Xms512m -Xmx512m
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-log:/home/rocketmq/logs/rocketmqlogs
    networks:
      - pei-network

  rocketmq-broker:
    image: apache/rocketmq:latest
    container_name: rocketmq-broker
    restart: unless-stopped
    user: root
    ports:
      - "10911:10911"
      - "10909:10909"
      - "10912:10912"
    environment:
      JAVA_OPT: -server -Xms256M -Xmx256M
      NAMESRV_ADDR: rocketmq-namesrv:9876
    # --enable-proxy 开启broker与proxy共用模式 生产部署建议将proxy单独部署
    command: sh mqbroker --enable-proxy -c /home/rocketmq/broker/config/broker.conf
    depends_on:
      - rocketmq-namesrv
    volumes:
      - rocketmq-broker-config:/home/rocketmq/broker/config
      - rocketmq-broker-logs:/home/rocketmq/logs/rocketmqlogs
      - rocketmq-broker-store:/home/rocketmq/store
    privileged: true
    networks:
      - pei-network

  rocketmq-console:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocketmq-console
    restart: unless-stopped
    ports:
      - "19876:19876"
    environment:
      JAVA_OPTS: -Xms128M -Xmx256M -Dserver.port=19876 -Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false
    volumes:
      - rocketmq-console-data:/tmp
    depends_on:
      - rocketmq-namesrv
    networks:
      - pei-network

  zookeeper:
    image: "bitnami/zookeeper:3.8.0"
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      TZ: Asia/Shanghai
      ALLOW_ANONYMOUS_LOGIN: "no"
      ZOO_ENABLE_AUTH: "yes"
      ZOO_SERVER_USERS: root
      ZOO_SERVER_PASSWORDS: ${DEHAZE_PASSWORD}
      ZOO_CLIENT_USER: root
      ZOO_CLIENT_PASSWORD: ${DEHAZE_PASSWORD}
      ZOO_SERVER_ID: 1
      ZOO_PORT_NUMBER: 2181
      # 自带的控制台 一般用不上可自行开启
      ZOO_ENABLE_ADMIN_SERVER: "no"
      # 自带控制台的端口
      ZOO_ADMIN_SERVER_PORT_NUMBER: 8080
    networks:
      - pei-network

  kafka:
    image: "bitnami/kafka:3.6.2"
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      TZ: Asia/Shanghai
      # 更多变量 查看文档 https://github.com/bitnami/bitnami-docker-kafka/blob/master/README.md
      KAFKA_BROKER_ID: 1
      # 监听端口
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      # 实际访问ip 本地用 127 内网用 192 外网用 外网ip
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://earthyzinc.devcloud.woa.com:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
      # Zookeeper SASL 认证配置
      KAFKA_ZOOKEEPER_PROTOCOL: SASL
      KAFKA_ZOOKEEPER_USER: root
      KAFKA_ZOOKEEPER_PASSWORD: ${DEHAZE_PASSWORD}
      # 账号鉴权（SASL/PLAIN）字段
      KAFKA_CLIENT_USERS: root
      KAFKA_CLIENT_PASSWORDS: ${DEHAZE_PASSWORD}
      KAFKA_INTER_BROKER_USER: root
      KAFKA_INTER_BROKER_PASSWORD: ${DEHAZE_PASSWORD}
      KAFKA_OPTS: "-Djava.security.auth.login.config=/opt/bitnami/kafka/config/kafka_jaas.conf"
    volumes:
      - kafka-data:/bitnami/kafka/data
      - ./config/kafka/kafka_jaas.conf:/opt/bitnami/kafka/config/kafka_jaas.conf:ro
    depends_on:
      - zookeeper
    networks:
      - pei-network

  kafka-manager:
    image: sheepkiller/kafka-manager:latest
    container_name: kafka-manager
    restart: unless-stopped
    ports:
      - "19092:19092"
    environment:
      ZK_HOSTS: zookeeper:2181
      APPLICATION_SECRET: letmein
      KAFKA_MANAGER_USERNAME: root
      KAFKA_MANAGER_PASSWORD: ${DEHAZE_PASSWORD}
      KM_ARGS: -Dhttp.port=19092
    command: -Dplay.server.pidfile.path=/dev/null
    depends_on:
      - kafka
    networks:
      - pei-network

  sky-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: sky-oap
    restart: unless-stopped
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx512m
      #记录数据的有效期，单位天
      - SW_CORE_RECORD_DATA_TTL=7
      #分析指标数据的有效期，单位天
      - SW_CORE_METRICS_DATA_TTL=7
      - SW_STORAGE=elasticsearch
      - SW_STORAGE_ES_CLUSTER_NODES=elasticsearch:9200
      - SW_STORAGE_ES_HTTP_PROTOCOL=HTTP
      - SW_ES_USER=elastic
      - SW_ES_PASSWORD=${DEHAZE_PASSWORD}
      - TZ=Asia/Shanghai
    depends_on:
      - elasticsearch
    networks:
      - pei-network

  sky-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: sky-ui
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      SW_SERVER_PORT: 18080
      SW_OAP_ADDRESS: http://sky-oap:12800
      TZ: Asia/Shanghai
    depends_on:
      - sky-oap
    networks:
      - pei-network

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.3.0
    container_name: xxl-job-admin
    restart: unless-stopped
    ports:
      - "14980:8080"
    environment:
      - PARAMS=--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=${DEHAZE_PASSWORD} --xxl.job.accessToken=${DEHAZE_PASSWORD}
      - JAVA_OPTS=-Xmx512m
    volumes:
      - xxl-job-logs:/data/applogs
    depends_on:
      - mysql
    networks:
      - pei-network

  # Prometheus
  prometheus:
    image: ubuntu/prometheus:2.50-22.04_stable
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9091:9091"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml --web.listen-address=:9091
    networks:
      - pei-network

  # Grafana (监控可视化)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${DEHAZE_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - pei-network

  # Node Exporter (宿主机 CPU/内存/磁盘指标)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - pei-network

  # MySQL Exporter
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld-exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    environment:
      - DATA_SOURCE_NAME=root:${DEHAZE_PASSWORD}@(mysql:3306)/
    networks:
      - pei-network

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${DEHAZE_PASSWORD}
    networks:
      - pei-network

volumes:
  mysql-data:
    external: true
  mysql-logs:
    external: true
  mysql-config:
    external: true
  redis-data:
    external: true
  mongo-data:
    external: true
  mongo-config:
    external: true
  mongo-logs:
    external: true
  minio-config:
    external: true
  minio-data:
    external: true

  es-data:
    external: true
  es-logs:
    external: true
  es-plugins:
    external: true
  kibana-config:
    external: true
  logstash-pipeline:
    external: true
  logstash-config:
    external: true
  nacos-logs:
    external: true
  rabbitmq-data:
    external: true
  rabbitmq-logs:
    external: true
  rocketmq-namesrv-log:
    external: true
  rocketmq-broker-config:
    external: true
  rocketmq-broker-logs:
    external: true
  rocketmq-broker-store:
    external: true
  rocketmq-console-data:
    external: true
  kafka-data:
    external: true
  xxl-job-logs:
    external: true
  prometheus-data:
    external: true
  grafana-data:
    external: true
