networks:
  pei-network:
    driver: bridge

services:
  # MySQL
  mysql:
    image: mysql:8.4.5
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DEHAZE_PASSWORD}
      - TZ=Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-logs:/var/log/mysql
      - mysql-config:/etc/mysql/conf.d
    command: --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    privileged: true
    networks:
      - pei-network

  # Redis
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${DEHAZE_PASSWORD}",
      ]
    privileged: true
    networks:
      - pei-network

  # MongoDB
  mongodb:
    image: bitnami/mongodb:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - mongo-logs:/var/log/mongodb
    environment:
      - MONGODB_ROOT_USER=root
      - MONGODB_ROOT_PASSWORD=${DEHAZE_PASSWORD}
      - MONGODB_DATABASE=admin
    networks:
      - pei-network

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9090:9090"
    environment:
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=${DEHAZE_PASSWORD}
      - MINIO_BROWSER_DEFAULT_LOCALE=zh_CN
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    command: server /data --console-address :9090 --address :9000
    privileged: true
    networks:
      - pei-network

  # ElasticSearch (Single Node)
  elasticsearch:
    image: elasticsearch:8.18.2
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - node.name=elasticsearch
      - ELASTIC_PASSWORD=123456
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - TZ=Asia/Shanghai
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-logs:/usr/share/elasticsearch/logs
      - es-plugins:/usr/share/elasticsearch/plugins
    networks:
      - pei-network

  kibana:
    image: kibana:8.18.2
    container_name: kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    depends_on:
      # kibana在elasticsearch启动之后再启动
      - elasticsearch
    environment:
      #设置系统语言文中文
      I18N_LOCALE: zh-CN
      # 访问域名
      # SERVER_PUBLICBASEURL: https://kibana.cloud.com
    volumes:
      - kibana-config:/usr/share/kibana/config
    networks:
      - pei-network

  logstash:
    image: logstash:8.18.2
    container_name: logstash
    restart: unless-stopped
    ports:
      - "4560:4560"
    volumes:
      - logstash-pipeline:/usr/share/logstash/pipeline
      - logstash-config:/usr/share/logstash/config
    depends_on:
      - elasticsearch
    networks:
      - pei-network

  # Nacos Server
  nacos:
    image: nacos/nacos-server:latest
    container_name: nacos
    restart: unless-stopped
    volumes:
      - nacos-logs:/root/nacos/logs
    environment:
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=2222
      - NACOS_AUTH_IDENTITY_VALUE=2xxx
      - NACOS_AUTH_TOKEN=VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
      - NACOS_CONSOLE_PORT=10848
      - JVM_XMS=128m
      - JVM_XMX=256m
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=123456
      - MYSQL_DATABASE_NUM=1
      - MYSQL_SERVICE_DB_PARAM=characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    ports:
      - "8848:8848"
      - "9848:9848"
      - "10848:10848"
    networks:
      - pei-network
    depends_on:
      - mysql

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=root
      - RABBITMQ_DEFAULT_PASS=123456
    networks:
      - pei-network

  rocketmq-namesrv:
    image: apache/rocketmq:latest
    container_name: rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT: -server -Xms512m -Xmx512m
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-log:/home/rocketmq/logs/rocketmqlogs
    networks:
      - pei-network

  rocketmq-broker:
    image: apache/rocketmq:latest
    container_name: rocketmq-broker
    restart: unless-stopped
    user: root
    ports:
      - "10911:10911"
      - "10909:10909"
      - "10912:10912"
    environment:
      JAVA_OPT: -server -Xms256M -Xmx256M
      NAMESRV_ADDR: rocketmq-namesrv:9876
    # --enable-proxy 开启broker与proxy共用模式 生产部署建议将proxy单独部署
    command: sh mqbroker --enable-proxy -c /home/rocketmq/broker/config/broker.conf
    depends_on:
      - rocketmq-namesrv
    volumes:
      - rocketmq-broker-config:/home/rocketmq/broker/config
      - rocketmq-broker-logs:/home/rocketmq/logs/rocketmqlogs
      - rocketmq-broker-store:/home/rocketmq/store
    privileged: true
    networks:
      - pei-network

  rocketmq-console:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rocketmq-console
    restart: unless-stopped
    ports:
      - "19876:19876"
    environment:
      JAVA_OPTS: -Xms128M -Xmx256M -Dserver.port=19876 -Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false
    volumes:
      - rocketmq-console-data:/tmp
    depends_on:
      - rocketmq-namesrv
    networks:
      - pei-network

  zookeeper:
    image: "bitnami/zookeeper:3.8.0"
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      TZ: Asia/Shanghai
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_SERVER_ID: 1
      ZOO_PORT_NUMBER: 2181
      # 自带的控制台 一般用不上可自行开启
      ZOO_ENABLE_ADMIN_SERVER: "no"
      # 自带控制台的端口
      ZOO_ADMIN_SERVER_PORT_NUMBER: 8080
    networks:
      - pei-network

  kafka:
    image: "bitnami/kafka:3.6.2"
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      TZ: Asia/Shanghai
      # 更多变量 查看文档 https://github.com/bitnami/bitnami-docker-kafka/blob/master/README.md
      KAFKA_BROKER_ID: 1
      # 监听端口
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      # 实际访问ip 本地用 127 内网用 192 外网用 外网ip
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://10.242.150.100:9092
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka/data
    depends_on:
      - zookeeper
    networks:
      - pei-network

  kafka-manager:
    image: sheepkiller/kafka-manager:latest
    container_name: kafka-manager
    restart: unless-stopped
    ports:
      - "19092:19092"
    environment:
      ZK_HOSTS: zookeeper:2181
      APPLICATION_SECRET: letmein
      KAFKA_MANAGER_USERNAME: root
      KAFKA_MANAGER_PASSWORD: 123456
      KM_ARGS: -Dhttp.port=19092
    command: -Dplay.server.pidfile.path=/dev/null
    depends_on:
      - kafka
    networks:
      - pei-network

  sky-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: sky-oap
    restart: unless-stopped
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx512m
      #记录数据的有效期，单位天
      - SW_CORE_RECORD_DATA_TTL=7
      #分析指标数据的有效期，单位天
      - SW_CORE_METRICS_DATA_TTL=7
      - SW_STORAGE=elasticsearch
      - SW_STORAGE_ES_CLUSTER_NODES=elasticsearch:9200
      - SW_STORAGE_ES_HTTP_PROTOCOL=HTTP
      - SW_ES_USER=elastic
      - SW_ES_PASSWORD="123456"
      - TZ=Asia/Shanghai
    depends_on:
      - elasticsearch
    networks:
      - pei-network

  sky-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: sky-ui
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      SW_SERVER_PORT: 18080
      SW_OAP_ADDRESS: http://sky-oap:12800
      TZ: Asia/Shanghai
    depends_on:
      - sky-oap
    networks:
      - pei-network

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.1.0
    container_name: xxl-job-admin
    restart: unless-stopped
    ports:
      - "14980:8080"
    environment:
      - PARAMS=--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - JAVA_OPTS=-Xmx512m
    volumes:
      - xxl-job-logs:/data/applogs
    networks:
      - pei-network

  tdengine:
    image: tdengine/tdengine
    container_name: tdengine
    restart: unless-stopped
    ports:
      - "6030:6030"
      - "6041:6041"
      - "6043:6043"
      - "6044-6049:6044-6049"
      - "6044-6045:6044-6045/udp"
      - "6060:6060"
    volumes:
      - tdengine-data:/var/lib/taos
      - tdengine-logs:/var/log/taos
    networks:
      - pei-network

  postgres:
    image: postgres
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: sonarqube
      ALLOW_IP_RANGE: 0:0:0:0/0
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pei-network

  sonarqube:
    image: sonarqube:lts-enterprise
    container_name: sonarqube
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: root
      SONAR_JDBC_PASSWORD: 123456
    ports:
      - "9100:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-conf:/opt/sonarqube/conf
    privileged: true
    depends_on:
      - postgres
    networks:
      - pei-network

  sandbox:
    image: langgenius/dify-sandbox:0.2.12
    container_name: sandbox
    restart: unless-stopped
    environment:
      # The DifySandbox configurations
      # Make sure you are changing this key for your deployment with a strong key.
      # You can generate a strong key using `openssl rand -base64 42`.
      API_KEY: dify-sandbox
      GIN_MODE: release
      WORKER_TIMEOUT: 15
      ENABLE_NETWORK: true
      HTTP_PROXY: http://ssrf_proxy:3128
      HTTPS_PROXY: http://ssrf_proxy:3128
      SANDBOX_PORT: 8194
      PIP_MIRROR_URL:
    volumes:
      - sandbox-dependencies:/dependencies
      - sandbox-conf:/conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
    networks:
      - pei-network

  # plugin daemon
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.2.0-local
    restart: unless-stopped
    container_name: plugin_daemon
    environment:
      # Use the shared environment variables.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: root
      DB_PASSWORD: 123456
      DB_DATABASE: dify_plugin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 123456
      SERVER_PORT: 5002
      SERVER_KEY: lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi
      MAX_PLUGIN_PACKAGE_SIZE: 52428800
      PPROF_ENABLED: false
      DIFY_INNER_API_URL: http://host.docker.internal:5001
      DIFY_INNER_API_KEY: QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1
      PLUGIN_REMOTE_INSTALLING_HOST: 0.0.0.0
      PLUGIN_REMOTE_INSTALLING_PORT: 5003
      PLUGIN_WORKING_PATH: /app/storage/cwd
      FORCE_VERIFYING_SIGNATURE: true
      PYTHON_ENV_INIT_TIMEOUT: 120
      PLUGIN_MAX_EXECUTION_TIMEOUT: 600
      PIP_MIRROR_URL:
      PLUGIN_STORAGE_TYPE: local
      PLUGIN_STORAGE_LOCAL_ROOT: /app/storage
      PLUGIN_INSTALLED_PATH: plugin
      PLUGIN_PACKAGE_CACHE_PATH: plugin_packages
      PLUGIN_MEDIA_CACHE_PATH: assets
      PLUGIN_STORAGE_OSS_BUCKET:
      S3_USE_AWS: false
      S3_USE_AWS_MANAGED_IAM: false
      S3_ENDPOINT:
      S3_USE_PATH_STYLE: false
      AWS_ACCESS_KEY:
      AWS_SECRET_KEY:
      AWS_REGION:
      AZURE_BLOB_STORAGE_CONNECTION_STRING:
      AZURE_BLOB_STORAGE_CONTAINER_NAME:
      TENCENT_COS_SECRET_KEY:
      TENCENT_COS_SECRET_ID:
      TENCENT_COS_REGION:
      ALIYUN_OSS_REGION:
      ALIYUN_OSS_ENDPOINT:
      ALIYUN_OSS_ACCESS_KEY_ID:
      ALIYUN_OSS_ACCESS_KEY_SECRET:
      ALIYUN_OSS_AUTH_VERSION:
      ALIYUN_OSS_PATH:
      VOLCENGINE_TOS_ENDPOINT:
      VOLCENGINE_TOS_ACCESS_KEY:
      VOLCENGINE_TOS_SECRET_KEY:
      VOLCENGINE_TOS_REGION:
    ports:
      - "5002:5002"
      - "5003:5003"
    volumes:
      - plugin_daemon:/app/storage
    networks:
      - pei-network

  # ssrf_proxy server
  # for more information, please refer to
  # https://docs.dify.ai/learn-more/faq/install-faq#18-why-is-ssrf-proxy-needed%3F
  ssrf_proxy:
    image: ubuntu/squid:latest
    container_name: ssrf_proxy
    restart: unless-stopped
    volumes:
      - ssrf-proxy-sh:/ssrf_proxy
    entrypoint:
      [
        "sh",
        "-c",
        "cp /ssrf_proxy/docker-entrypoint.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    environment:
      # pls clearly modify the squid env vars to fit your network environment.
      HTTP_PORT: 3128
      COREDUMP_DIR: /var/spool/squid
      REVERSE_PROXY_PORT: 8194
      SANDBOX_HOST: sandbox
      SANDBOX_PORT: 8194
    ports:
      - "3128:3128"
      - "8194:8194"
    networks:
      - pei-network

  #  # The Weaviate vector store.
  weaviate:
    image: semitechnologies/weaviate:1.19.0
    restart: unless-stopped
    container_name: weaviate
    volumes:
      # Mount the Weaviate data directory to the container.
      - weaviate:/var/lib/weaviate
    environment:
      # The Weaviate configurations
      # You can refer to the [Weaviate](https://weaviate.io/developers/weaviate/config-refs/env-vars) documentation for more information.
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: false
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_APIKEY_ENABLED: true
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih
      AUTHENTICATION_APIKEY_USERS: hello@dify.ai
      AUTHORIZATION_ADMINLIST_ENABLED: true
      AUTHORIZATION_ADMINLIST_USERS: hello@dify.ai
    ports:
      - "8080:8080"
    networks:
      - pei-network

volumes:
  mysql-data:

  mysql-logs:

  mysql-config:

  redis-data:

  mongo-data:

  mongo-config:

  mongo-logs:

  minio-data:

  minio-config:

  es-data:
    external: true
  es-logs:
    external: true
  es-plugins:
    external: true
  kibana-config:
    external: true
  logstash-pipeline:
    external: true
  logstash-config:
    external: true
  nacos-logs:
    external: true
  rabbitmq-data:
    external: true
  rabbitmq-logs:
    external: true
  rocketmq-namesrv-log:
    external: true
  rocketmq-broker-config:
    external: true
  rocketmq-broker-logs:
    external: true
  rocketmq-broker-store:
    external: true
  rocketmq-console-data:
    external: true
  kafka-data:
    external: true
  xxl-job-logs:
    external: true
  tdengine-data:
    external: true
  tdengine-logs:
    external: true
  postgres-data:
    external: true
  sonarqube-data:
    external: true
  sonarqube-extensions:
    external: true
  sonarqube-logs:
    external: true
  sonarqube-conf:
    external: true
  sandbox-dependencies:
    external: true
  sandbox-conf:
    external: true
  plugin_daemon:
    external: true
  ssrf-proxy-conf:
    external: true
  ssrf-proxy-sh:
    external: true
  weaviate:
    external: true
