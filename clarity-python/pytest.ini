[pytest]
# 异步测试模式
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 测试发现路径
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    api: API 接口测试
    slow: 慢速测试
    requires_db: 需要数据库的测试
    requires_redis: 需要 Redis 的测试
    external_paid: 依赖真实外部付费 API 的测试（默认不跑，需要时 `-m external_paid` 显式运行；本地 DB 档位换算的付费模型单测不属此类，常跑）

# 全局用例超时（pytest-timeout，秒）：防止测试卡死无限挂起。
# 2026-08 曾出现 pytest 进程无超时挂起 117 天/7 天（futex_wait）残留，
# 且干扰 _mysql_schema 重建测试库造成间歇失败。个别慢测试用
# @pytest.mark.timeout(秒) 覆盖，或 --timeout 命令行临时调整。
timeout = 600

# 输出配置
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning

# 日志配置
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
