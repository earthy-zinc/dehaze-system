[project]
name = "dehaze-voice"
version = "1.0.0"
description = "图像去雾系统语音推理引擎服务（FunASR / Piper）"
requires-python = ">=3.11, <4.0"
dependencies = [
    # HTTP / WebSocket 服务
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0",
    # 离线 ASR 与 multipart 表单解析
    "python-multipart>=0.0.20",
    # 权重下载（TTS onnx 断点续传）与测试客户端
    "httpx>=0.28.1",
    # 日志（NDJSON）与指标
    "python-json-logger>=4.0.0",
    "prometheus-client>=0.21.0",
    # ASR 引擎（FunASR 本机推理；模型经 ModelScope 自动下载缓存）
    "funasr>=1.2.0",
    "modelscope>=1.20.0",
    "numpy>=1.26.0",
    # TTS 引擎（Piper）。lameenc 为 MP3 编码依赖
    "piper-tts>=1.6",
    "lameenc>=1.7",
    # 推理与重采样：torch 必须显式声明并与 torchaudio 同源（Linux/Windows 走 cu128 源），
    # 否则 torchaudio 的 PyPI metadata 不 pin torch，会解析出跨版本族的错配组合（dlopen 崩溃）
    "torch>=2.9.0",
    "torchaudio>=2.9.0,<2.10; sys_platform == 'darwin'",
    "torchaudio>=2.9.0; sys_platform != 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.22",
]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

# ASR/TTS 需要 CUDA 加速时（ASR_DEVICE=cuda:0 / onnxruntime-gpu）从 PyTorch 官方源取 CUDA 版 torch
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

# ============ Ruff：lint + format 统一工具（替代 black + isort + flake8）============
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["logs", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes（未使用导入/变量等）
    "I",    # isort 导入排序
    "B",    # bugbear 常见 bug 模式
    "UP",   # pyupgrade 语法现代化
    "RET",  # return 语句卫生（消除多余 else 分支、return 后死代码）
    "ISC",  # 隐式字符串拼接检测
    "PT",   # pytest 最佳实践
    "FLY",  # join/format 旧写法 → f-string
    "SIM",  # 常见可简化写法
    "C4",   # comprehensions 推导式现代化
    "RUF",  # ruff 自有规则（含无效 noqa 校验）
    "N",    # PEP 8 命名规范
    "EM",   # 异常消息规范
    "PERF", # 性能反模式
    "PTH",  # os.path → pathlib 现代路径写法
]
ignore = [
    "B008",   # FastAPI Depends() 用作默认参数是官方惯用写法
    "RUF001", # 中文字符串中的全角标点，误报
    "RUF002", # 中文 docstring 中的全角标点，误报
    "RUF003", # 中文注释中的全角标点，误报
    "RUF012", # 类属性按语义就是默认值，不应标 ClassVar
    "EM101",  # 异常消息内联字面量即可，不必强制模块级常量
    "EM102",  # 同上，f-string 异常消息可 grep
    "N803",   # API 契约字段沿用调用方命名
    "N815",   # 同上，请求/响应模型的契约字段
    "N818",   # 异常类名沿用跨服务统一约定（VoiceError 子类按语义命名）
    "N999",   # 目录名 dehaze-voice 含连字符导致的模块名推断误报
]

[tool.ruff.lint.isort]
known-first-party = ["app", "algorithm", "conftest"]

# config.py 用全大写 @property 模拟配置常量（MODELSCOPE_CACHE_DIR 等），属命名惯例
[tool.ruff.lint.per-file-ignores]
"app/config.py" = ["N802"]
