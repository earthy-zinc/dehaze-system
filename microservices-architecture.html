<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>微服务系统架构图 · Excalidraw 手绘风</title>
<style>
  :root{
    --gw-fill:#E0E7FF; --gw-stroke:#4F46E5;
    --bs-fill:#DCFCE7; --bs-stroke:#16A34A;
    --in-fill:#FFEDD5; --in-stroke:#EA580C;
    --grid:#ECECEC;
    --ink:#1f2937;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#fafafa;color:var(--ink);
    font-family:"Comic Sans MS","Comic Sans","Segoe Print","Bradley Hand","Chalkboard SE",cursive,sans-serif;}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 16px 48px;}
  h1{font-size:26px;margin:0 0 4px;font-weight:700;letter-spacing:.5px;}
  .sub{font-size:14px;color:#6b7280;margin:0 0 18px;}
  .card{background:#fff;border:1px solid #eee;border-radius:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.06);padding:10px;}
  svg{width:100%;height:auto;display:block;}

  /* hand-drawn nodes */
  .node{cursor:pointer;transition:opacity .15s ease;}
  .node .box{transition:stroke-width .15s ease;}
  .node text{pointer-events:none;user-select:none;}
  .edge{transition:opacity .15s ease;}

  /* hover dimming */
  .dim .node:not(.lit){opacity:.12;}
  .dim .edge:not(.lit){opacity:.04;}
  .node.lit .box{stroke-width:3.4;}
  .edge.lit .line{stroke-width:2.8;}

  .legend{display:flex;flex-wrap:wrap;gap:18px;align-items:center;
    margin-top:16px;font-size:14px;}
  .legend .item{display:flex;align-items:center;gap:8px;}
  .sw{width:20px;height:14px;border-radius:4px;border:2px solid;}
  .hint{margin-left:auto;font-size:13px;color:#9ca3af;}
  .foot{margin-top:14px;font-size:12px;color:#b0b4bb;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>微服务系统架构图</h1>
  <p class="sub">Hand-drawn · Excalidraw 风格 · 单文件 HTML（内联 SVG，无外部依赖）</p>

  <div class="card">
    <svg id="diagram" viewBox="0 0 1040 660" preserveAspectRatio="xMidYMid meet" aria-label="microservices architecture">
      <defs>
        <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
          <path d="M 28 0 L 0 0 0 28" fill="none" stroke="var(--grid)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect x="0" y="0" width="1040" height="660" fill="#ffffff"/>
      <rect x="0" y="0" width="1040" height="660" fill="url(#grid)"/>
      <g id="edges"></g>
      <g id="nodes"></g>
    </svg>
  </div>

  <div class="legend">
    <div class="item"><span class="sw" style="background:var(--gw-fill);border-color:var(--gw-stroke)"></span>网关层 (Gateway)</div>
    <div class="item"><span class="sw" style="background:var(--bs-fill);border-color:var(--bs-stroke)"></span>业务服务 (Business)</div>
    <div class="item"><span class="sw" style="background:var(--in-fill);border-color:var(--in-stroke)"></span>基础设施 (Infrastructure)</div>
    <div class="hint">↳ 悬停任意服务，高亮其全部连接</div>
  </div>
  <p class="foot">箭头表示调用 / 数据流方向 · 颜色按层级区分</p>
</div>

<script>
(function(){
  const SVGNS="http://www.w3.org/2000/svg";

  /* ---------- seeded PRNG for stable "hand-drawn" randomness ---------- */
  function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function rngFrom(seed){let s=seed>>>0||1;return function(){s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}

  /* ---------- rough path helpers ---------- */
  function roughLinePath(x1,y1,x2,y2,rng,overshoot){
    overshoot=overshoot||3;
    const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const sx=x1-ux*overshoot, sy=y1-uy*overshoot;
    const ex=x2+ux*overshoot, ey=y2+uy*overshoot;
    const mx=(sx+ex)/2, my=(sy+ey)/2;
    const nx=-uy, ny=ux;
    const off=(rng()*2-1)*Math.min(6,len*0.09);
    return `M ${sx.toFixed(1)} ${sy.toFixed(1)} Q ${(mx+nx*off).toFixed(1)} ${(my+ny*off).toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
  }
  function roughRectPath(x,y,w,h,rng){
    const x2=x+w,y2=y+h;
    const segs=[[x,y,x2,y],[x2,y,x2,y2],[x2,y2,x,y2],[x,y2,x,y]];
    return segs.map(s=>roughLinePath(s[0],s[1],s[2],s[3],rng,2.5)).join(" ");
  }

  /* ---------- node & edge data ---------- */
  const TIER={
    gateway:{fill:"var(--gw-fill)",stroke:"var(--gw-stroke)"},
    business:{fill:"var(--bs-fill)",stroke:"var(--bs-stroke)"},
    infra:{fill:"var(--in-fill)",stroke:"var(--in-stroke)"}
  };
  const nodes=[
    {id:"gw",  label:"API Gateway", sub:"路由 / 限流", tier:"gateway", x:430,y:70,w:180,h:72},
    {id:"auth",label:"Auth Service", sub:"认证 / JWT", tier:"business", x:40,y:270,w:150,h:72},
    {id:"user",label:"User Service", sub:"用户", tier:"business", x:235,y:270,w:150,h:72},
    {id:"order",label:"Order Service", sub:"订单", tier:"business", x:430,y:270,w:150,h:72},
    {id:"pay", label:"Payment Service", sub:"支付", tier:"business", x:625,y:270,w:150,h:72},
    {id:"notif",label:"Notification Service", sub:"通知", tier:"business", x:820,y:270,w:160,h:72},
    {id:"kafka",label:"Message Queue", sub:"Kafka", tier:"infra", x:300,y:480,w:200,h:72},
    {id:"pg",  label:"Database", sub:"PostgreSQL", tier:"infra", x:640,y:480,w:220,h:72}
  ];
  const edges=[
    {from:"gw",to:"auth",label:"认证"},
    {from:"gw",to:"user",label:"用户"},
    {from:"gw",to:"order",label:"下单"},
    {from:"gw",to:"pay",label:"支付"},
    {from:"gw",to:"notif",label:"通知"},
    {from:"order",to:"pay",label:"校验"},
    {from:"order",to:"kafka",label:"发布事件"},
    {from:"pay",to:"kafka",label:"支付结果"},
    {from:"kafka",to:"notif",label:"推送"},
    {from:"user",to:"pg",label:"读写"},
    {from:"order",to:"pg",label:"读写"},
    {from:"pay",to:"pg",label:"读写"},
    {from:"auth",to:"pg",label:"认证数据"}
  ];

  const nodeMap={}; nodes.forEach(n=>nodeMap[n.id]=n);
  function center(n){return {x:n.x+n.w/2,y:n.y+n.h/2};}
  function borderPoint(n,towardX,towardY){
    const c=center(n);let dx=towardX-c.x,dy=towardY-c.y;
    if(dx===0&&dy===0)return c;
    const hw=n.w/2,hh=n.h/2;
    const scale=1/Math.max(Math.abs(dx)/hw,Math.abs(dy)/hh);
    return {x:c.x+dx*scale,y:c.y+dy*scale};
  }

  /* ---------- render edges ---------- */
  const edgesG=document.getElementById("edges");
  const edgeEls=[];
  edges.forEach((e,i)=>{
    const s=nodeMap[e.from],t=nodeMap[e.to];
    const sc=center(s),tc=center(t);
    const a=borderPoint(s,tc.x,tc.y);
    const b=borderPoint(t,sc.x,sc.y);
    const rng=rngFrom(hash(e.from+">"+e.to));
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const endPt={x:b.x-ux*15,y:b.y-uy*15};
    const mx=(a.x+endPt.x)/2,my=(a.y+endPt.y)/2;
    const nx=-uy,ny=ux;
    const off=(rng()*2-1)*Math.min(12,len*0.06);
    const d=`M ${a.x.toFixed(1)} ${a.y.toFixed(1)} Q ${(mx+nx*off).toFixed(1)} ${(my+ny*off).toFixed(1)} ${endPt.x.toFixed(1)} ${endPt.y.toFixed(1)}`;

    const g=document.createElementNS(SVGNS,"g");
    g.setAttribute("class","edge");
    g.dataset.from=e.from; g.dataset.to=e.to;

    const line=document.createElementNS(SVGNS,"path");
    line.setAttribute("class","line");
    line.setAttribute("d",d);
    line.setAttribute("fill","none");
    line.setAttribute("stroke","#374151");
    line.setAttribute("stroke-width","2.2");
    line.setAttribute("stroke-linecap","round");
    g.appendChild(line);

    // arrowhead (two barbs at target border)
    const ang=Math.atan2(uy,ux);
    const size=12,spread=0.42;
    const a1=ang+Math.PI-spread,a2=ang+Math.PI+spread;
    const hx1=b.x+Math.cos(a1)*size,hy1=b.y+Math.sin(a1)*size;
    const hx2=b.x+Math.cos(a2)*size,hy2=b.y+Math.sin(a2)*size;
    const head=document.createElementNS(SVGNS,"path");
    head.setAttribute("d",`M ${hx1.toFixed(1)} ${hy1.toFixed(1)} L ${b.x.toFixed(1)} ${b.y.toFixed(1)} L ${hx2.toFixed(1)} ${hy2.toFixed(1)}`);
    head.setAttribute("fill","none");
    head.setAttribute("stroke","#374151");
    head.setAttribute("stroke-width","2.2");
    head.setAttribute("stroke-linecap","round");
    head.setAttribute("stroke-linejoin","round");
    g.appendChild(head);

    // label with white halo
    if(e.label){
      const lx=mx, ly=my-12;
      const lw=e.label.length*8+12;
      const bg=document.createElementNS(SVGNS,"rect");
      bg.setAttribute("x",(lx-lw/2).toFixed(1));
      bg.setAttribute("y",(ly-11).toFixed(1));
      bg.setAttribute("width",lw.toFixed(1));
      bg.setAttribute("height","20");
      bg.setAttribute("rx","5");
      bg.setAttribute("fill","#ffffff");
      bg.setAttribute("opacity","0.92");
      bg.setAttribute("stroke","none");
      g.appendChild(bg);
      const tx=document.createElementNS(SVGNS,"text");
      tx.setAttribute("x",lx.toFixed(1));
      tx.setAttribute("y",(ly+4).toFixed(1));
      tx.setAttribute("text-anchor","middle");
      tx.setAttribute("font-size","12.5");
      tx.setAttribute("fill","#374151");
      tx.textContent=e.label;
      g.appendChild(tx);
    }
    edgesG.appendChild(g);
    edgeEls.push(g);
  });

  /* ---------- render nodes ---------- */
  const nodesG=document.getElementById("nodes");
  const nodeEls={};
  nodes.forEach(n=>{
    const t=TIER[n.tier];
    const rng=rngFrom(hash(n.id));
    const rot=(rng()*2-1)*1.1;

    const g=document.createElementNS(SVGNS,"g");
    g.setAttribute("class","node");
    g.setAttribute("data-id",n.id);
    g.setAttribute("transform",`rotate(${rot.toFixed(2)} ${(n.x+n.w/2).toFixed(1)} ${(n.y+n.h/2).toFixed(1)})`);

    const box=document.createElementNS(SVGNS,"path");
    box.setAttribute("class","box");
    box.setAttribute("d",roughRectPath(n.x,n.y,n.w,n.h,rng));
    box.setAttribute("fill",t.fill);
    box.setAttribute("stroke",t.stroke);
    box.setAttribute("stroke-width","2.4");
    box.setAttribute("stroke-linejoin","round");
    g.appendChild(box);

    const t1=document.createElementNS(SVGNS,"text");
    t1.setAttribute("x",(n.x+n.w/2).toFixed(1));
    t1.setAttribute("y",(n.y+n.h/2-2).toFixed(1));
    t1.setAttribute("text-anchor","middle");
    t1.setAttribute("font-size","15");
    t1.setAttribute("font-weight","700");
    t1.setAttribute("fill","#111827");
    t1.textContent=n.label;
    g.appendChild(t1);

    const t2=document.createElementNS(SVGNS,"text");
    t2.setAttribute("x",(n.x+n.w/2).toFixed(1));
    t2.setAttribute("y",(n.y+n.h/2+16).toFixed(1));
    t2.setAttribute("text-anchor","middle");
    t2.setAttribute("font-size","12");
    t2.setAttribute("fill","#4b5563");
    t2.textContent=n.sub;
    g.appendChild(t2);

    nodesG.appendChild(g);
    nodeEls[n.id]=g;
  });

  /* ---------- hover interaction ---------- */
  const svg=document.getElementById("diagram");
  Object.keys(nodeEls).forEach(id=>{
    const el=nodeEls[id];
    el.addEventListener("mouseenter",()=>highlight(id));
    el.addEventListener("mouseleave",clear);
  });
  function highlight(id){
    svg.classList.add("dim");
    const litNodes=new Set([id]);
    edgeEls.forEach(g=>{
      if(g.dataset.from===id||g.dataset.to===id){
        g.classList.add("lit");
        litNodes.add(g.dataset.from);
        litNodes.add(g.dataset.to);
      }
    });
    litNodes.forEach(nid=>{ if(nodeEls[nid]) nodeEls[nid].classList.add("lit"); });
  }
  function clear(){
    svg.classList.remove("dim");
    edgeEls.forEach(g=>g.classList.remove("lit"));
    Object.values(nodeEls).forEach(e=>e.classList.remove("lit"));
  }
})();
</script>
</body>
</html>
