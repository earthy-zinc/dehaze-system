<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CDP Probe OK</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif;
           background: linear-gradient(135deg, #1e3a8a, #0ea5e9); color: #fff; }
    .card { text-align: center; }
    h1 { font-size: 48px; margin: 0 0 8px; }
    p  { font-size: 18px; opacity: .9; margin: 6px 0; }
    button { font-size: 16px; padding: 10px 22px; border: 0; border-radius: 999px; cursor: pointer;
             background: #fff; color: #1e3a8a; font-weight: 600; margin-top: 16px; }
    button:active { transform: scale(.97); }
    #count { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CDP Probe OK</h1>
    <p id="stamp"></p>
    <p>点击次数：<span id="count">0</span></p>
    <button id="btn" type="button">点我 +1</button>
  </div>
  <script>
    document.getElementById('stamp').textContent = 'rendered at ' + new Date().toISOString();

    let count = 0;
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('count').textContent = ++count;
      console.log('[probe] clicked, count =', count);
    });

    console.info('[probe] page ready');
    console.debug('[probe] debug line');
    console.warn('[probe] warn line');
    console.error('[probe] error line');
  </script>
</body>
</html>
