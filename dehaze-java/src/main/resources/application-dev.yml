server:
  port: 8989
  tomcat:
    threads:
      max: 400
      min-spare: 50
    max-connections: 10000
    accept-count: 200
    connection-timeout: 20000
    max-keep-alive-requests: 100
spring:
  devtools:
    restart:
      enabled: true
  jackson:
    ## 默认序列化时间格式
    date-format: yyyy-MM-dd HH:mm:ss
    ## 默认序列化时区
    time-zone: GMT+8
    default-property-inclusion: non_null
    ## JSR-310 日期时间模块配置
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dehaze?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true
    username: root
    password: ${DEHAZE_PASSWORD}
    druid:
      # 初始连接数（建议保持与最小空闲一致）
      initial-size: 5
      # 最小空闲连接（防止突发流量导致连接创建延迟）
      min-idle: 5
      # 最大活跃连接数（根据DB配置max_connections调整）
      max-active: 50
      # 获取连接最大等待时间（毫秒，避免线程长时间阻塞）
      max-wait: 5000
      # 空闲连接检查周期（60秒扫描一次空闲连接）
      time-between-eviction-runs-millis: 60000
      # 连接最小空闲时间（300秒后回收空闲连接）
      min-evictable-idle-time-millis: 300000
      # 验证查询语句（保持与数据库类型匹配）
      validation-query: SELECT 1
      # 空闲时验证连接有效性（推荐开启）
      test-while-idle: true
      # 获取连接时不验证（避免性能损耗）
      test-on-borrow: false
      # 归还连接时不验证（同上）
      test-on-return: false
      # 启用统计监控和防火墙（防御SQL注入）
      filters: stat,wall
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      password: ${DEHAZE_PASSWORD}
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数（默认8，压测时易成瓶颈，调大到32）
          max-active: 32
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认-1
          max-wait: -1
          # 连接池中的最大空闲连接 默认8
          max-idle: 16
          # 连接池中的最小空闲连接 默认0
          min-idle: 4
    mongodb:
      uri: mongodb://root:${DEHAZE_PASSWORD}@localhost:27017/dehaze?authSource=admin
  cache:
    enabled: true
    # 缓存类型 redis、none(不使用缓存)
    type: redis
    # 缓存时间(单位：ms)
    redis:
      time-to-live: 3600000
      # 缓存null值，防止缓存穿透
      cache-null-values: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  global-config:
    db-config:
      # 主键ID类型
      id-type: auto
      # 逻辑删除字段名称
      logic-delete-field: deleted
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 配置枚举处理器，使MyBatis-Plus能够正确处理枚举类型
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

# 安全配置
security:
  jwt:
    key: ${JWT_SECRET_KEY:SecretKey012345678901234567890123456789012345678901234567890123456789}
    ttl: 7200
    refresh-ttl: 604800
  ignore-urls:
    - /v3/api-docs/**
    - /doc.html
    - /swagger-resources/**
    - /webjars/**
    - /doc.html
    - /swagger-ui/**
    - /swagger-ui.html
    - /api/v1/files/download/**
    - /api/v1/auth/captcha
    - /api/v1/auth/login
    - /api/v1/auth/refresh

# 监控配置 (开发环境适度开放，禁止暴露 heapdump/env/configprops 等高危端点)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    enable:
      prometheus: true
  endpoint:
    health:
      show-details: WHEN_AUTHORIZED

file:
  # 上传类型 (目前支持minio OSS、local 本地存储)
  type: minio
  # 是否基于 datasetPath 初始化数据集（初始化完成后改回 false，避免每次重启重复扫描）
  init: false
  # 上传文件基于url（用户主动上传的文件走 MinIO + Java 下载接口）
  # 与 datasetBaseUrl 一致使用 127.0.0.1，避免 localhost 在浏览器跨域判定中与 127.0.0.1 视为不同 origin
  baseUrl: http://127.0.0.1:8989/api/v1/files/download
  # 初始化数据集所在文件夹（nginx-dataset 容器挂载的宿主机路径）
  datasetPath: D:/DeepLearning/dataset
  # nginx-dataset 静态服务基础 URL（数据集源文件由此直服，不经过 MinIO）
  datasetBaseUrl: http://127.0.0.1:9000
  # 本地存储
  local:
    uploadPath: /data/workspace/dehaze-system/upload
  # MinIO 对象存储服务
  minio:
    # 服务Endpoint
    endpoint: http://127.0.0.1:9100
    # 访问凭据
    access-key: admin
    # 凭据密钥
    secret-key: ${DEHAZE_PASSWORD}
    # 存储桶名称
    bucket-name: dehaze

# springdoc配置： https://springdoc.org/properties.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.pei.dehaze.controller
  default-flat-param-object: true

# knife4j的增强配置，不需要增强可以不配 https://doc.xiaominfo.com/docs/quick-start
knife4j:
  enable: true
  # 开启生产环境屏蔽模式 (即使开发环境也建议开启基本保护)
  production: false
  setting:
    language: zh_cn

# xxl-job 定时任务配置
xxl:
  job:
    # 定时任务开关
    enabled: false
    admin:
      # 多个地址使用,分割
      addresses: http://127.0.0.1:8080/xxl-job-admin
    accessToken: default_token
    executor:
      appname: xxl-job-executor-${spring.application.name}
      address:
      ip:
      port: 9999
      logpath: /mnt/e/ProgramProject/new-dehaze/dehaze-java/logs/xxl-job
      logretentiondays: 30

# Python 算法服务配置
algorithm:
  python:
    # 服务基础地址（开发环境指向本地 dehaze-python 服务，端口与 dehaze-python 启动端口一致）
    baseUrl: http://127.0.0.1:8991
    # 连接超时（毫秒）
    connect-timeout: 5000
    # 读取超时（毫秒）—— 预测/评估可耗时较长
    read-timeout: 30000
    # 最大重试次数
    max-retry: 3
    # 重试初始退避（毫秒），指数增长
    retry-backoff: 1000
    # 熔断失败率阈值（%）
    circuit-breaker-failure-rate: 50
    # 熔断最小调用次数
    circuit-breaker-min-calls: 10
    # 熔断后半开等待（毫秒）
    circuit-breaker-half-open-delay: 30000

# 验证码配置
captcha:
  # 验证码类型 circle-圆圈干扰验证码|gif-Gif验证码|line-干扰线验证码|shear-扭曲干扰验证码
  type: circle
  # 验证码宽度
  width: 120
  # 验证码高度
  height: 40
  # 验证码干扰元素个数
  interfere-count: 2
  # 文本透明度(0.0-1.0)
  text-alpha: 0.8
  # 验证码字符配置
  code:
    type: random
    length: 4
  # 验证码字体
  font:
    name: SansSerif
    weight: 1
    size: 24
  # 验证码有效期(秒)
  expire-seconds: 120

# RabbitMQ 配置 (异步任务分发)
rabbitmq:
  # 是否启用 RabbitMQ
  enabled: true
  # RabbitMQ 连接 URL (amqp://user:password@host:port/vhost)
  url: amqp://root:${DEHAZE_PASSWORD}@127.0.0.1:5672/%2F
  # 交换机配置
  exchange:
    # 任务交换机名称 (与 Go 端保持一致)
    name: dehaze.tasks
    # 路由键前缀
    routing-key-prefix: "task."
  # 重连配置
  reconnect:
    # 初始重连间隔 (毫秒)
    initial-interval: 1000
    # 最大重连间隔 (毫秒)
    max-interval: 30000
    # 重连乘数
    multiplier: 2.0

# CORS 跨域配置 (开发环境白名单)
cors:
  allowed-origins:
    # 前端开发服务器（Vite/Metro/Taro）
    - http://localhost:5173   # dehaze-front-react (Vite)
    - http://localhost:5174   # dehaze-front-vue (Vite)
    - http://localhost:5175   # dehaze-taro (H5)
    - http://localhost:5176   # dehaze-uniapp (H5)
    - http://localhost:5177   # dehaze-flutter (Web)
    - http://localhost:5183   # dehaze-front-react (Electron)
    - http://localhost:5184   # dehaze-front-vue (Electron)
    - http://localhost:8081    # dehaze-react-native (Metro)
    - http://127.0.0.1:5173
    - http://127.0.0.1:5174
    - http://127.0.0.1:5175
    - http://127.0.0.1:5176
    - http://127.0.0.1:5177
    - http://127.0.0.1:5183
    - http://127.0.0.1:5184
    - http://127.0.0.1:8081

# Kafka 配置 (日志收集与流处理)
kafka:
  # 是否启用 Kafka
  enabled: false
  # Kafka Broker 地址 (多个用逗号分隔)
  bootstrap-servers: localhost:9092
  # 生产者配置
  producer:
    # 消息确认模式 (all, 1, 0)
    acks: all
    # 重试次数
    retries: 3
    # 批量发送大小 (字节)
    batch-size: 16384
    # 批量发送延迟 (毫秒)
    linger-ms: 5
    # 缓冲区大小 (字节)
    buffer-memory: 33554432
  # 消费者配置
  consumer:
    # 消费者组 ID
    group-id: dehaze-java
    # 自动提交偏移量
    enable-auto-commit: false
    # 消费起始位置 (earliest, latest)
    auto-offset-reset: earliest
    # 单次拉取最大记录数
    max-poll-records: 100
    # 拉取超时时间 (毫秒)
    poll-timeout-ms: 1000
  # 日志管道配置
  log-pipeline:
    # 日志 Topic 名称 (与 Go 端保持一致)
    topic: dehaze.logs
    # 是否启用日志管道
    enabled: false

# 读取根目录的 .env
springdotenv:
  directory: ../