server:
  port: 80

# CORS 跨域配置 (生产环境通过环境变量 CORS_ALLOWED_ORIGINS 配置，逗号分隔)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:8081}

spring:
  jackson:
    ## 默认序列化时间格式
    date-format: yyyy-MM-dd HH:mm:ss
    ## 默认序列化时区
    time-zone: GMT+8
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.31.3:3306/dehaze?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true
    username: root
    password: ${DEHAZE_PASSWORD}
  data:
    redis:
      database: 0
      host: 192.168.31.3
      port: 6379
      password: ${DEHAZE_PASSWORD}
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数 默认8 ，负数表示没有限制
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认-1
          max-wait: -1
          # 连接池中的最大空闲连接 默认8
          max-idle: 8
          # 连接池中的最小空闲连接 默认0
          min-idle: 0
    mongodb:
      uri: mongodb://root:${DEHAZE_PASSWORD}@192.168.31.3:27017/dehaze?authSource=admin
  cache:
    enabled: true
    # 缓存类型 redis、none(不使用缓存)
    type: redis
    # 缓存时间(单位：ms)
    redis:
      time-to-live: 3600000
      # 缓存null值，防止缓存穿透
      cache-null-values: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  global-config:
    db-config:
      # 主键ID类型
      id-type: none
      # 逻辑删除字段名称
      logic-delete-field: deleted
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


# 安全配置
security:
  jwt:
    key: ${JWT_SECRET_KEY}
    ttl: 7200
    refresh-ttl: 604800
  session:
    cookie:
      # 生产环境 HTTPS，启用 Secure 防止 Cookie 在明文传输中泄露
      secure: true
      # 生产环境无代理前缀，Path=/api 限制 Cookie 仅在 API 路径携带
      path: /api


# 监控配置 (生产环境仅暴露必要端点)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: WHEN_AUTHORIZED

# 文件上传配置
file:
  # OSS 类型 (目前支持aliyun、minio)
  type: minio
  # 上传文件基于url
  baseUrl: http://10.16.12.65:8989/api/v1/files/download
  # 数据集根目录
  datasetPath: /app/dataset
  # 本地存储
  local:
    uploadPath: /app/upload
  # MinIO 对象存储服务
  minio:
    # 服务Endpoint
    endpoint: http://192.168.31.3:9000
    # 访问凭据
    access-key: admin
    # 凭据密钥
    secret-key: ${DEHAZE_PASSWORD}
    # 存储桶名称
    bucket-name: dehaze

# springdoc配置 (生产环境禁用 API 文档)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 模型权重文件存储配置（复用 nginx-dataset 静态服务 /models 路径）
algorithm:
  model:
    baseUrl: http://127.0.0.1:9000/models
    connect-timeout: 5000
    read-timeout: 10000

# knife4j (生产环境禁用)
knife4j:
  enable: false

# xxl-job 定时任务配置
xxl:
  job:
    # 定时任务开关
    enabled: true
    admin:
      # 多个地址使用,分割
      addresses: http://127.0.0.1:14980/xxl-job-admin
    accessToken: ${DEHAZE_PASSWORD:12345678}
    executor:
      appname: xxl-job-executor-${spring.application.name}
      address:
      ip:
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

# 验证码配置
captcha:
  # 验证码类型 circle-圆圈干扰验证码|gif-Gif验证码|line-干扰线验证码|shear-扭曲干扰验证码
  type: circle
  # 验证码宽度
  width: 120
  # 验证码高度
  height: 40
  # 验证码干扰元素个数
  interfere-count: 2
  # 文本透明度(0.0-1.0)
  text-alpha: 0.8
  # 验证码字符配置
  code:
    # 验证码字符类型 math-算术|random-随机字符
    type: math
    # 验证码字符长度，type=算术时，表示运算位数(1:个位数运算 2:十位数运算)；type=随机字符时，表示字符个数
    length: 1
  # 验证码字体
  font:
    # 字体名称 Dialog|DialogInput|Monospaced|Serif|SansSerif
    name: SansSerif
    # 字体样式 0-普通|1-粗体|2-斜体
    weight: 1
    # 字体大小
    size: 20
  # 验证码有效期(秒)
  expire-seconds: 120

# 读取根目录的 .env
springdotenv:
  directory: ../

# 支付渠道配置（默认关闭，启用时调用真实 SDK）
payment:
  wechat:
    enabled: ${WECHAT_PAY_ENABLED:false}
    appId: ${WECHAT_PAY_APP_ID:}
    mchId: ${WECHAT_PAY_MCH_ID:}
    apiKey: ${WECHAT_PAY_API_KEY:}
    privateKey: ${WECHAT_PAY_PRIVATE_KEY:}
    publicKey: ${WECHAT_PAY_PUBLIC_KEY:}
    notifyUrl: ${WECHAT_PAY_NOTIFY_URL:}
    refundNotifyUrl: ${WECHAT_PAY_REFUND_NOTIFY_URL:}
    baseUrl: ${WECHAT_PAY_BASE_URL:https://api.mch.weixin.qq.com}
  alipay:
    enabled: ${ALIPAY_ENABLED:false}
    appId: ${ALIPAY_APP_ID:}
    mchId: ${ALIPAY_MCH_ID:}
    apiKey: ${ALIPAY_API_KEY:}
    privateKey: ${ALIPAY_PRIVATE_KEY:}
    publicKey: ${ALIPAY_PUBLIC_KEY:}
    notifyUrl: ${ALIPAY_NOTIFY_URL:}
    refundNotifyUrl: ${ALIPAY_REFUND_NOTIFY_URL:}
    baseUrl: ${ALIPAY_BASE_URL:https://openapi.alipay.com}