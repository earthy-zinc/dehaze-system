spring:
  devtools:
    restart:
      enabled: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dehaze_test?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true&allowMultiQueries=true
    username: root
    password: 123456
    druid:
      # 初始连接数（建议保持与最小空闲一致）
      initial-size: 5
      # 最小空闲连接（防止突发流量导致连接创建延迟）
      min-idle: 5
      # 最大活跃连接数（根据DB配置max_connections调整）
      max-active: 50
      # 获取连接最大等待时间（毫秒，避免线程长时间阻塞）
      max-wait: 5000
      # 空闲连接检查周期（60秒扫描一次空闲连接）
      time-between-eviction-runs-millis: 60000
      # 连接最小空闲时间（300秒后回收空闲连接）
      min-evictable-idle-time-millis: 300000
      # 验证查询语句（保持与数据库类型匹配）
      validation-query: SELECT 1
      # 空闲时验证连接有效性（推荐开启）
      test-while-idle: true
      # 获取连接时不验证（避免性能损耗）
      test-on-borrow: false
      # 归还连接时不验证（同上）
      test-on-return: false
      # 启用统计监控和防火墙（防御SQL注入）
      filters: stat,wall
  sql:
    init:
      mode: never
      # schema-locations: classpath:db/schema-test.sql
      # data-locations: classpath:db/data-test.sql
      encoding: UTF-8
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      password: 123456
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数 默认8 ，负数表示没有限制
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认-1
          max-wait: -1
          # 连接池中的最大空闲连接 默认8
          max-idle: 8
          # 连接池中的最小空闲连接 默认0
          min-idle: 0
    mongodb:
      uri: mongodb://root:123456@localhost:27017/dehaze?authSource=admin
  cache:
    type: none
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  type: local
  init: false
  # 上传文件基于url
  baseUrl: http://localhost:8989/api/v1/files/download
  # 初始化数据集所在文件夹
  datasetPath: D:/DeepLearning/dataset
  # 本地存储
  local:
    uploadPath: E:/ProgramProject/new-dehaze/dehaze-java/upload
  minio:
    enabled: false

security:
  jwt:
    key: TestSecretKey0123456789012345678901234567890123456789
    ttl: 60
    ignore-urls:
      - /v3/api-docs/**
      - /swagger-ui/**


mybatis-plus:
  global-config:
    db-config:
      # 主键ID类型
      id-type: none
      # 逻辑删除字段名称
      logic-delete-field: deleted
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    enabled: false
knife4j:
  enable: false

captcha:
  # 验证码类型 circle-圆圈干扰验证码|gif-Gif验证码|line-干扰线验证码|shear-扭曲干扰验证码
  type: circle
  # 验证码宽度
  width: 120
  # 验证码高度
  height: 40
  # 验证码干扰元素个数
  interfere-count: 2
  # 文本透明度(0.0-1.0)
  text-alpha: 0.8
  # 验证码字体
  font:
    # 字体名称 Dialog|DialogInput|Monospaced|Serif|SansSerif
    name: SansSerif
    # 字体样式 0-普通|1-粗体|2-斜体
    weight: 1
    # 字体大小
    size: 24
  code:
    type: random
    length: 4
    expire-seconds: 30