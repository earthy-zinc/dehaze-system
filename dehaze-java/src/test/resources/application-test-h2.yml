spring:
  devtools:
    restart:
      enabled: false
  datasource:
    url: jdbc:h2:mem:dehaze_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/*.sql
      data-locations: classpath:db/data/*.sql
      encoding: UTF-8
  data:
    redis:
      database: 0
      host: ${DEHAZE_HOST:127.0.0.1}
      port: 6379
      password: ${DEHAZE_PASSWORD}
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数 默认8 ，负数表示没有限制
          max-active: 8
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认-1
          max-wait: -1
          # 连接池中的最大空闲连接 默认8
          max-idle: 8
          # 连接池中的最小空闲连接 默认0
          min-idle: 0
    mongodb:
      uri: mongodb://root:${DEHAZE_PASSWORD}@${DEHAZE_HOST:127.0.0.1}:27017/dehaze?authSource=admin
  cache:
    type: none
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  type: local
  init: false
  # 上传文件基于url
  baseUrl: http://127.0.0.1:8989/api/v1/files/download
  # 初始化数据集所在文件夹
  datasetPath: D:/DeepLearning/dataset
  # 本地存储
  local:
    uploadPath: ./upload
  minio:
    enabled: false

security:
  jwt:
    key: TestSecretKey0123456789012345678901234567890123456789
    ttl: 60


mybatis-plus:
  global-config:
    db-config:
      # 主键ID类型
      id-type: none
      # 逻辑删除字段名称
      logic-delete-field: deleted
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    enabled: false
knife4j:
  enable: false

captcha:
  # 验证码类型 circle-圆圈干扰验证码|gif-Gif验证码|line-干扰线验证码|shear-扭曲干扰验证码
  type: circle
  # 验证码宽度
  width: 120
  # 验证码高度
  height: 40
  # 验证码干扰元素个数
  interfere-count: 2
  # 文本透明度(0.0-1.0)
  text-alpha: 0.8
  # 验证码字体
  font:
    # 字体名称 Dialog|DialogInput|Monospaced|Serif|SansSerif
    name: SansSerif
    # 字体样式 0-普通|1-粗体|2-斜体
    weight: 1
    # 字体大小
    size: 24
  code:
    type: random
    length: 4
    expire-seconds: 30