    <style id="theme-vars">
/* Dehaze System - Brand Tokens (Desktop App) */
:root {
  /* Brand primary scale */
  --dehaze-primary-50: #eff6ff;
  --dehaze-primary-100: #dbeafe;
  --dehaze-primary-200: #bfdbfe;
  --dehaze-primary-300: #93c5fd;
  --dehaze-primary-400: #60a5fa;
  --dehaze-primary-500: #3b82f6;
  --dehaze-primary-600: #2563eb;
  --dehaze-primary-700: #1d4ed8;
  --dehaze-primary-800: #1e40af;
  --dehaze-primary-900: #1e3a8a;

  /* Neutral scale */
  --dehaze-neutral-0: #ffffff;
  --dehaze-neutral-50: #f9fafb;
  --dehaze-neutral-100: #f3f4f6;
  --dehaze-neutral-200: #e5e7eb;
  --dehaze-neutral-300: #d1d5db;
  --dehaze-neutral-400: #9ca3af;
  --dehaze-neutral-500: #6b7280;
  --dehaze-neutral-600: #4b5563;
  --dehaze-neutral-700: #374151;
  --dehaze-neutral-800: #1f2937;
  --dehaze-neutral-900: #111827;

  /* Semantic tokens (light mode default) */
  --dehaze-background: #ffffff;
  --dehaze-foreground: #1f2937;
  --dehaze-card: #ffffff;
  --dehaze-card-foreground: #1f2937;
  --dehaze-popover: #ffffff;
  --dehaze-popover-foreground: #1f2937;
  --dehaze-primary: #3b82f6;
  --dehaze-primary-foreground: #ffffff;
  --dehaze-muted: #f3f4f6;
  --dehaze-muted-foreground: #6b7280;
  --dehaze-border: #e5e7eb;
  --dehaze-input: #e5e7eb;
  --dehaze-ring: #3b82f6;

  /* State colors */
  --dehaze-state-success: #4caf50;
  --dehaze-state-warning: #ff9800;
  --dehaze-state-error: #f44336;
  --dehaze-state-info: #2196f3;

  /* Radius scale */
  --dehaze-radius-sm: 4px;
  --dehaze-radius-md: 8px;
  --dehaze-radius-lg: 12px;
  --dehaze-radius-xl: 16px;
  --dehaze-radius-full: 9999px;

  /* Typography */
  --dehaze-font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --dehaze-font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;

  /* Shadows */
  --dehaze-shadow-1: 0 2px 8px rgba(0, 0, 0, 0.08);
  --dehaze-shadow-2: 0 4px 12px rgba(0, 0, 0, 0.12);
  --dehaze-shadow-3: 0 8px 24px rgba(0, 0, 0, 0.12);
  --dehaze-shadow-4: 0 12px 24px rgba(0, 0, 0, 0.14);
  --dehaze-shadow-5: 0 16px 32px rgba(0, 0, 0, 0.16);

  /* Spacing */
  --dehaze-space-xs: 4px;
  --dehaze-space-sm: 8px;
  --dehaze-space-md: 16px;
  --dehaze-space-lg: 24px;
  --dehaze-space-xl: 32px;
  --dehaze-space-2xl: 48px;

  /* Desktop app shell dimensions */
  --dehaze-rail-width: 72px;
  --dehaze-titlebar-height: 40px;
}

/* Dark mode tokens */
html.dark {
  --dehaze-background: #0b1120;
  --dehaze-foreground: #f8fafc;
  --dehaze-card: #111827;
  --dehaze-card-foreground: #f8fafc;
  --dehaze-popover: #111827;
  --dehaze-popover-foreground: #f8fafc;
  --dehaze-primary: #60a5fa;
  --dehaze-primary-foreground: #0b1120;
  --dehaze-muted: #1e293b;
  --dehaze-muted-foreground: #94a3b8;
  --dehaze-border: #334155;
  --dehaze-input: #334155;
  --dehaze-ring: #60a5fa;
}

/* Base typography */
body {
  font-family: var(--dehaze-font-sans);
  color: var(--dehaze-foreground);
  background-color: var(--dehaze-background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Heading scale */
.dehaze-heading-hero {
  font-size: clamp(40px, 5vw, 72px);
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.dehaze-heading-h1 {
  font-size: clamp(30px, 3vw, 44px);
  line-height: 1.2;
  font-weight: 700;
}

.dehaze-heading-h2 {
  font-size: clamp(24px, 2.4vw, 34px);
  line-height: 1.25;
  font-weight: 600;
}

.dehaze-heading-h3 {
  font-size: clamp(18px, 1.8vw, 24px);
  line-height: 1.3;
  font-weight: 600;
}

.dehaze-body {
  font-size: 16px;
  line-height: 1.6;
  font-weight: 400;
}

.dehaze-body-sm {
  font-size: 14px;
  line-height: 1.5;
  font-weight: 400;
}

.dehaze-caption {
  font-size: 12px;
  line-height: 1.4;
  font-weight: 400;
}

/* Buttons */
.dehaze-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
}

.dehaze-btn:active {
  transform: scale(0.97);
}

.dehaze-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.dehaze-btn-primary {
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  color: #ffffff;
  border-radius: var(--dehaze-radius-md);
  padding: 12px 24px;
  font-size: 16px;
}

.dehaze-btn-primary:hover {
  box-shadow: var(--dehaze-shadow-3);
  transform: translateY(-1px);
}

.dehaze-btn-secondary {
  background-color: var(--dehaze-neutral-100);
  color: var(--dehaze-neutral-700);
  border-radius: var(--dehaze-radius-md);
  padding: 12px 24px;
  font-size: 16px;
}

.dehaze-btn-secondary:hover {
  background-color: var(--dehaze-neutral-200);
}

.dehaze-btn-ghost {
  background-color: transparent;
  color: var(--dehaze-primary);
  border-radius: var(--dehaze-radius-md);
  padding: 12px 24px;
  font-size: 16px;
}

.dehaze-btn-ghost:hover {
  background-color: var(--dehaze-primary-50);
}

/* Cards */
.dehaze-card {
  background-color: var(--dehaze-card);
  border-radius: var(--dehaze-radius-xl);
  box-shadow: var(--dehaze-shadow-1);
  border: 1px solid var(--dehaze-border);
}

.dehaze-card-hover:hover {
  box-shadow: var(--dehaze-shadow-3);
  transform: translateY(-4px);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

/* Forms */
.dehaze-input {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  font-size: 15px;
  border: 1px solid var(--dehaze-input);
  border-radius: var(--dehaze-radius-md);
  background-color: var(--dehaze-background);
  color: var(--dehaze-foreground);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.dehaze-input:focus {
  outline: none;
  border-color: var(--dehaze-primary);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.dehaze-input::placeholder {
  color: var(--dehaze-muted-foreground);
}

/* Utility gradients */
.dehaze-gradient-primary {
  background: linear-gradient(135deg, #3b82f6, #6366f1);
}

.dehaze-gradient-metric {
  background: linear-gradient(135deg, #667eea, #764ba2);
}

.dehaze-text-gradient {
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Status badges */
.dehaze-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: var(--dehaze-radius-full);
  font-size: 12px;
  font-weight: 500;
}

.dehaze-badge-success {
  background-color: rgba(76, 175, 80, 0.12);
  color: #2e7d32;
}

.dehaze-badge-warning {
  background-color: rgba(255, 152, 0, 0.12);
  color: #ef6c00;
}

.dehaze-badge-error {
  background-color: rgba(244, 67, 54, 0.12);
  color: #c62828;
}

.dehaze-badge-info {
  background-color: rgba(33, 150, 243, 0.12);
  color: #1565c0;
}

/* Layout helpers */
.dehaze-container {
  width: 100%;
  max-width: 1280px;
  margin-left: auto;
  margin-right: auto;
  padding-left: var(--dehaze-space-lg);
  padding-right: var(--dehaze-space-lg);
}

.dehaze-surface {
  background-color: var(--dehaze-card);
  border: 1px solid var(--dehaze-border);
  border-radius: var(--dehaze-radius-xl);
}

/* Desktop app shell */
.dehaze-titlebar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--dehaze-titlebar-height);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 0 0 12px;
  background-color: var(--dehaze-card);
  border-bottom: 1px solid var(--dehaze-border);
  -webkit-app-region: drag;
  app-region: drag;
}

.dehaze-titlebar-actions,
.dehaze-titlebar-win-brand,
.dehaze-titlebar-win-ctrls {
  -webkit-app-region: no-drag;
  app-region: no-drag;
}

/* Windows-style app brand (left) */
.dehaze-titlebar-win-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-right: 8px;
  flex-shrink: 0;
}

.dehaze-titlebar-win-logo {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

.dehaze-titlebar-win-appname {
  font-size: 13px;
  font-weight: 600;
  color: var(--dehaze-foreground);
  white-space: nowrap;
}

/* Windows-style window controls (right) */
.dehaze-titlebar-win-divider {
  width: 1px;
  height: 20px;
  background-color: var(--dehaze-border);
  margin: 0 4px;
  flex-shrink: 0;
}

.dehaze-titlebar-win-ctrls {
  display: flex;
  align-items: center;
  height: 100%;
  flex-shrink: 0;
}

.dehaze-titlebar-win-ctrl {
  width: 46px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--dehaze-neutral-700);
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease;
}

.dehaze-titlebar-win-ctrl:hover {
  background-color: var(--dehaze-muted);
  color: var(--dehaze-foreground);
}

.dehaze-titlebar-win-ctrl.close:hover {
  background-color: #e81123;
  color: #ffffff;
}

.dehaze-titlebar-win-ctrl svg {
  width: 10px;
  height: 10px;
  flex-shrink: 0;
}

.dehaze-titlebar-center {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--dehaze-muted-foreground);
  -webkit-app-region: no-drag;
  app-region: no-drag;
}
.dehaze-titlebar-center .tb-crumb { cursor: pointer; transition: color 0.15s ease; }
.dehaze-titlebar-center .tb-crumb:hover { color: var(--dehaze-primary); }
.dehaze-titlebar-center .tb-sep { color: var(--dehaze-neutral-300); font-size: 12px; }
.dehaze-titlebar-center .tb-current { color: var(--dehaze-foreground); font-weight: 600; }
.dehaze-titlebar-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--dehaze-neutral-500);
  -webkit-app-region: no-drag;
  app-region: no-drag;
}
.dehaze-titlebar-btn {
  width: 32px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--dehaze-radius-md);
  color: var(--dehaze-neutral-500);
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.dehaze-titlebar-btn:hover { background-color: var(--dehaze-muted); color: var(--dehaze-foreground); }
.dehaze-titlebar-btn svg { width: 16px; height: 16px; }
.dehaze-titlebar-avatar {
  width: 28px; height: 28px;
  border-radius: 9999px;
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  color: #ffffff;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  margin-left: 4px;
}

.dehaze-rail {
  position: fixed;
  top: var(--dehaze-titlebar-height);
  left: 0;
  bottom: 0;
  width: var(--dehaze-rail-width);
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  gap: 6px;
  background-color: var(--dehaze-card);
  border-right: 1px solid var(--dehaze-border);
}

.dehaze-rail-item {
  width: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 8px 0;
  border-radius: var(--dehaze-radius-lg);
  font-size: 11px;
  font-weight: 500;
  color: var(--dehaze-neutral-500);
  text-decoration: none;
  transition: background-color 0.15s ease, color 0.15s ease;
}

.dehaze-rail-item:hover {
  background-color: var(--dehaze-muted);
  color: var(--dehaze-foreground);
}

.dehaze-rail-item.active {
  background-color: var(--dehaze-primary-50);
  color: var(--dehaze-primary);
}

.dehaze-rail-item svg {
  width: 22px;
  height: 22px;
}

.dehaze-content {
  margin-left: var(--dehaze-rail-width);
  padding-top: var(--dehaze-titlebar-height);
  min-height: 100vh;
  width: calc(100% - var(--dehaze-rail-width));
}

/* Animation helpers */
@keyframes dehaze-fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.dehaze-animate-fade-in {
  animation: dehaze-fade-in 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background-color: var(--dehaze-neutral-300);
  border-radius: var(--dehaze-radius-full);
}

::-webkit-scrollbar-thumb:hover {
  background-color: var(--dehaze-neutral-400);
}

        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>

    <div class="dehaze-titlebar-win-ctrls">
      <span class="dehaze-titlebar-win-ctrl" title="最小化">

      </span>
      <span class="dehaze-titlebar-win-ctrl" title="最大化">
        <svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1"></rect></svg>
      </span>
      <span class="dehaze-titlebar-win-ctrl close" data-dom-id="titlebar-close" title="关闭">

  <main class="ml-[var(--dehaze-rail-width)] mt-[var(--dehaze-titlebar-height)] h-[calc(100vh-var(--dehaze-titlebar-height))] overflow-y-auto p-6 bg-background" data-scroll-region="primary" style="height: 1582px;">
    <div class="max-w-6xl mx-auto space-y-6 dehaze-animate-fade-in">
      <section class="dehaze-card p-6">
        <div class="flex items-center gap-2 mb-6">
          <div class="flex items-center gap-2 text-sm font-medium text-primary"><span class="w-6 h-6 rounded-full bg-primary text-white flex items-center justify-center text-xs">1</span> 上传图片</div>
          <div class="h-px flex-1 bg-border"></div>
          <div class="flex items-center gap-2 text-sm font-medium text-muted-foreground"><span class="w-6 h-6 rounded-full bg-muted text-muted-foreground flex items-center justify-center text-xs">2</span> 选择算法</div>
          <div class="h-px flex-1 bg-border"></div>
          <div class="flex items-center gap-2 text-sm font-medium text-muted-foreground"><span class="w-6 h-6 rounded-full bg-muted text-muted-foreground flex items-center justify-center text-xs">3</span> 调节参数</div>
          <div class="h-px flex-1 bg-border"></div>
          <div class="flex items-center gap-2 text-sm font-medium text-muted-foreground"><span class="w-6 h-6 rounded-full bg-muted text-muted-foreground flex items-center justify-center text-xs">4</span> 结果预览</div>
        </div>

        <div class="grid lg:grid-cols-2 gap-6 mb-6">
          <div data-dom-id="upload-zone" class="border-2 border-dashed border-border rounded-xl p-8 flex flex-col items-center justify-center text-center hover:border-primary hover:bg-primary/5 transition-colors cursor-pointer min-h-[240px]">
            <div class="w-14 h-14 rounded-full bg-primary/10 text-primary flex items-center justify-center mb-4">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            <h3 class="font-semibold mb-1">拖拽图片到此处</h3>
            <p class="text-sm text-muted-foreground mb-4">支持 JPG、PNG、TIFF，最多 50 MB</p>
            <button data-dom-id="btn-browse" class="dehaze-btn dehaze-btn-secondary text-sm">选择文件</button>
          </div>

          <div>
            <div class="flex items-center gap-2 mb-4">
              <svg class="w-5 h-5 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              <input data-dom-id="algo-search" type="text" placeholder="搜索算法..." class="dehaze-input">
            </div>
            <div class="space-y-3 max-h-[260px] overflow-y-auto pr-1">
              <label data-dom-id="algo-aod" class="dehaze-card p-4 flex items-center gap-3 cursor-pointer hover:border-primary transition-colors">
                <input type="radio" name="algorithm" class="w-4 h-4 text-primary" checked>
                <div class="flex-1">
                  <div class="font-semibold">AOD-Net</div>
                  <div class="text-xs text-muted-foreground">轻量快速 · 端到端去雾</div>
                </div>
                <span class="dehaze-badge dehaze-badge-info">推荐</span>
              </label>
              <label data-dom-id="algo-ffa" class="dehaze-card p-4 flex items-center gap-3 cursor-pointer hover:border-primary transition-colors">
                <input type="radio" name="algorithm" class="w-4 h-4 text-primary">
                <div class="flex-1">
                  <div class="font-semibold">FFA-Net</div>
                  <div class="text-xs text-muted-foreground">特征融合 · 高 PSNR</div>
                </div>
              </label>
              <label data-dom-id="algo-grid" class="dehaze-card p-4 flex items-center gap-3 cursor-pointer hover:border-primary transition-colors">
                <input type="radio" name="algorithm" class="w-4 h-4 text-primary">
                <div class="flex-1">
                  <div class="font-semibold">GridDehazeNet</div>
                  <div class="text-xs text-muted-foreground">多尺度网格 · 细节保留</div>
                </div>
              </label>
            </div>
          </div>
        </div>

        <div class="grid lg:grid-cols-3 gap-6 mb-6">
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="text-sm font-medium">去雾强度</label>
              <span class="text-sm text-muted-foreground">75%</span>
            </div>
            <input data-dom-id="param-strength" type="range" min="0" max="100" value="75" class="w-full accent-primary">
          </div>
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="text-sm font-medium">亮度补偿</label>
              <span class="text-sm text-muted-foreground">12%</span>
            </div>
            <input data-dom-id="param-brightness" type="range" min="0" max="100" value="12" class="w-full accent-primary">
          </div>
          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="text-sm font-medium">对比度增强</label>
              <span class="text-sm text-muted-foreground">40%</span>
            </div>
            <input data-dom-id="param-contrast" type="range" min="0" max="100" value="40" class="w-full accent-primary">
          </div>
        </div>

        <div class="flex items-center justify-end">
          <button data-dom-id="btn-start-process" class="dehaze-btn dehaze-btn-primary px-8">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            开始处理
          </button>
        </div>
      </section>

      <section class="dehaze-card p-6">
        <h2 class="dehaze-heading-h3 text-lg mb-5">结果预览</h2>
        <div class="grid md:grid-cols-2 gap-4 mb-4">
          <div>
            <div class="text-sm text-muted-foreground mb-2">原图</div>
            <div class="aspect-video rounded-lg flex items-center justify-center text-white font-medium" style="background: linear-gradient(135deg, var(--dehaze-neutral-300), var(--dehaze-neutral-400))">原图占位</div>
          </div>
          <div>
            <div class="text-sm text-muted-foreground mb-2">去雾结果</div>
            <div class="aspect-video rounded-lg flex items-center justify-center text-white font-medium" style="background: linear-gradient(135deg, var(--dehaze-primary-300), var(--dehaze-primary-500))">结果占位</div>
          </div>
        </div>
        <div class="flex items-center gap-4 text-sm">
          <span class="text-muted-foreground">PSNR <strong class="text-foreground">42.3 dB</strong></span>
          <span class="text-muted-foreground">SSIM <strong class="text-foreground">0.982</strong></span>
          <span class="text-muted-foreground">耗时 <strong class="text-foreground">1.2 s</strong></span>
        </div>
      </section>

      <div class="fixed bottom-0 left-[var(--dehaze-rail-width)] right-0 h-14 bg-card/95 backdrop-blur-sm border-t border-border flex items-center justify-between px-6 z-40" data-dom-id="process-bar">
        <div class="flex items-center gap-4">
          <span class="text-sm font-medium">处理进度</span>
          <div class="w-48 h-2 rounded-full bg-muted overflow-hidden">
            <div class="h-full rounded-full dehaze-gradient-primary" style="width: 68%"></div>
          </div>
          <span class="text-sm text-muted-foreground">68% · 预计 12 秒</span>
        </div>
        <div class="flex items-center gap-3">
          <button data-dom-id="btn-pause" class="dehaze-btn dehaze-btn-secondary text-sm py-2 px-4">暂停</button>
          <button data-dom-id="btn-cancel" class="dehaze-btn dehaze-btn-ghost text-sm py-2 px-4">取消</button>
        </div>
      </div>
      <div class="h-20"></div>
    </div>
  </main>
