[project]
name = "clarity-test"
version = "0.1.0"
description = "Dehaze 跨端联调与集成测试工具集"
requires-python = ">=3.11"
# 不声明 dependencies，运行时复用 clarity-python/.venv
# 该 venv 已含：redis, pymysql, httpx, pytest, python-dotenv, sqlalchemy

[tool.pytest.ini_options]
testpaths = ["tests"]

# ============ Ruff：与 clarity-python / 各服务保持同一规则集 ============
[tool.ruff]
line-length = 100
target-version = "py311"
# pre-commit 会显式传入暂存文件路径，默认 exclude 对显式路径不生效
force-exclude = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes（未使用导入/变量等）
    "I",    # isort 导入排序
    "B",    # bugbear 常见 bug 模式
    "UP",   # pyupgrade 语法现代化
    "RET",  # return 语句卫生（消除多余 else 分支、return 后死代码）
    "ISC",  # 隐式字符串拼接检测
    "PT",   # pytest 最佳实践
    "FLY",  # join/format 旧写法 → f-string
    "SIM",  # 常见可简化写法
    "C4",   # comprehensions 推导式现代化
    "RUF",  # ruff 自有规则（含无效 noqa 校验）
    "N",    # PEP 8 命名规范
    "EM",   # 异常消息规范
    "PERF", # 性能反模式
    "PTH",  # os.path → pathlib 现代路径写法
]
ignore = [
    "RUF001", # 中文字符串中的全角标点，误报
    "RUF002", # 中文 docstring 中的全角标点，误报
    "RUF003", # 中文注释中的全角标点，误报
    "EM101",  # 异常消息内联字面量即可，不必强制模块级常量
    "EM102",  # 同上，f-string 异常消息可 grep
    "N999",   # 目录名 clarity-test 含连字符导致的模块名推断误报
]

[tool.ruff.lint.isort]
# utils/ 是本地包；kb_eval/ 是本地命名空间包（无需 __init__.py）；conftest 供 tests/ 识别
known-first-party = ["utils", "kb_eval", "conftest"]
