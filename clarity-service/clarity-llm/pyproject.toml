[project]
name = "clarity-llm"
version = "1.0.0"
description = "Dehaze 本地 LLM 推理服务（chat / embedding / rerank，内网专用）"
requires-python = ">=3.11, <4.0"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0",
    # 权重下载与测试客户端
    "httpx>=0.28.1",
    # 日志（NDJSON）与指标
    "python-json-logger>=4.0.0",
    "prometheus-client>=0.21.0",
    # 推理（llama.cpp 本地推理）
    # 跨平台基线：lock 锁定 PyPI sdist，uv sync 各平台本地编译（CPU 版，按本机指令集生成）。
    # Linux + NVIDIA GPU 加速需源码编译 CUDA 版覆盖安装：
    #   uv cache clean llama-cpp-python
    #   CMAKE_ARGS="-DGGML_CUDA=on" uv pip install --python .venv/bin/python --no-deps \
    #     --no-binary llama-cpp-python --force-reinstall llama-cpp-python==0.3.35
    # （官方 cu121 wheel 在 12-14 代 Intel 消费级 CPU 上会 SIGILL 崩溃，不可用）
    "llama-cpp-python>=0.3,<0.4",
]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

# ============ Ruff：与 clarity-python / 各服务保持同一规则集（四端统一）============
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "logs",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes（未使用导入/变量等）
    "I",    # isort 导入排序
    "B",    # bugbear 常见 bug 模式
    "UP",   # pyupgrade 语法现代化
    "RET",  # return 语句卫生（消除多余 else 分支、return 后死代码）
    "ISC",  # 隐式字符串拼接检测
    "PT",   # pytest 最佳实践
    "FLY",  # join/format 旧写法 → f-string
    "SIM",  # 常见可简化写法
    "C4",   # comprehensions 推导式现代化
    "RUF",  # ruff 自有规则（含无效 noqa 校验）
    "N",    # PEP 8 命名规范
    "EM",   # 异常消息规范
    "PERF", # 性能反模式
    "PTH",  # os.path → pathlib 现代路径写法
]
ignore = [
    "B008",   # FastAPI Depends() 用作默认参数是官方惯用写法
    "RUF001", # 中文字符串中的全角标点，误报
    "RUF002", # 中文 docstring 中的全角标点，误报
    "RUF003", # 中文注释中的全角标点，误报
    "RUF012", # Pydantic 可变类属性按设计就是字段默认值，不应标 ClassVar
    "EM101",  # 异常消息内联字面量即可，不必强制模块级常量
    "EM102",  # 同上，f-string 异常消息可 grep
    "N803",   # API 契约字段 camelCase，与 snake_case 规范冲突
    "N815",   # 同上，Pydantic 响应模型的 camelCase 字段（API 契约，禁止改名）
    "N818",   # 异常类名沿用跨端统一约定（ServiceError 等）
    "N999",   # 目录名 clarity-llm 含连字符导致的模块名推断误报
]

[tool.ruff.lint.isort]
known-first-party = ["app", "algorithm", "conftest"]
