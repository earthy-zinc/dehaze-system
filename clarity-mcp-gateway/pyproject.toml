[project]
name = "clarity-mcp-gateway"
version = "1.0.0"
description = "MCP 工具：读取后端 OpenAPI，自动注册为 MCP tool，供大模型调用后端 API"
requires-python = ">=3.11"
dependencies = [
    # 与 clarity-python 保持同一条 mcp 版本线：网关只是 clarity-python 的客户端
    # （MCP_GATEWAY_URL）对端，客户端侧 langchain-mcp-adapters 把 mcp 限制在 <2.0.0，
    # 两端同版本可避免协议/类型分裂（2.0 已把 mcp.server.fastmcp 改名为 mcpserver）。
    "mcp>=1.24.0,<1.25.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server.py"]

[tool.pytest.ini_options]
# 只收集单测：tests/live_test.py 是手动运行的 live 校验脚本（连真实网关 8082），
# 名字虽匹配 pytest 默认的 `*_test.py`，但 import 期连网/依赖 live 环境 ⇒ 显式收窄收集口径。
testpaths = ["tests"]
python_files = ["test_*.py"]

# ============ Ruff：与 clarity-python / 各服务保持同一规则集 ============
[tool.ruff]
line-length = 100
target-version = "py311"
# pre-commit 会显式传入暂存文件路径，默认 exclude 对显式路径不生效
force-exclude = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes（未使用导入/变量等）
    "I",    # isort 导入排序
    "B",    # bugbear 常见 bug 模式
    "UP",   # pyupgrade 语法现代化
    "RET",  # return 语句卫生（消除多余 else 分支、return 后死代码）
    "ISC",  # 隐式字符串拼接检测
    "PT",   # pytest 最佳实践
    "FLY",  # join/format 旧写法 → f-string
    "SIM",  # 常见可简化写法
    "C4",   # comprehensions 推导式现代化
    "RUF",  # ruff 自有规则（含无效 noqa 校验）
    "N",    # PEP 8 命名规范
    "EM",   # 异常消息规范
    "PERF", # 性能反模式
    "PTH",  # os.path → pathlib 现代路径写法
]
ignore = [
    "RUF001", # 中文字符串中的全角标点，误报
    "RUF002", # 中文 docstring 中的全角标点，误报
    "RUF003", # 中文注释中的全角标点，误报
    "EM101",  # 异常消息内联字面量即可，不必强制模块级常量
    "EM102",  # 同上，f-string 异常消息可 grep
    "N999",   # 目录名 clarity-mcp-gateway 含连字符导致的模块名推断误报
]

[tool.ruff.lint.isort]
# server.py 是本项目的顶层模块，tests/ 直接 `import server`
known-first-party = ["server"]
