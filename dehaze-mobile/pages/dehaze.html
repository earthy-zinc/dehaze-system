    <style id="theme-vars">
/* Dehaze System - Brand Tokens */
:root {
  /* Brand primary scale */
  --dehaze-primary-50: #eff6ff;
  --dehaze-primary-100: #dbeafe;
  --dehaze-primary-200: #bfdbfe;
  --dehaze-primary-300: #93c5fd;
  --dehaze-primary-400: #60a5fa;
  --dehaze-primary-500: #3b82f6;
  --dehaze-primary-600: #2563eb;
  --dehaze-primary-700: #1d4ed8;
  --dehaze-primary-800: #1e40af;
  --dehaze-primary-900: #1e3a8a;

  /* Neutral scale */
  --dehaze-neutral-0: #ffffff;
  --dehaze-neutral-50: #f9fafb;
  --dehaze-neutral-100: #f3f4f6;
  --dehaze-neutral-200: #e5e7eb;
  --dehaze-neutral-300: #d1d5db;
  --dehaze-neutral-400: #9ca3af;
  --dehaze-neutral-500: #6b7280;
  --dehaze-neutral-600: #4b5563;
  --dehaze-neutral-700: #374151;
  --dehaze-neutral-800: #1f2937;
  --dehaze-neutral-900: #111827;

  /* Semantic tokens (light mode default) */
  --dehaze-background: #ffffff;
  --dehaze-foreground: #1f2937;
  --dehaze-card: #ffffff;
  --dehaze-card-foreground: #1f2937;
  --dehaze-popover: #ffffff;
  --dehaze-popover-foreground: #1f2937;
  --dehaze-primary: #3b82f6;
  --dehaze-primary-foreground: #ffffff;
  --dehaze-muted: #f3f4f6;
  --dehaze-muted-foreground: #6b7280;
  --dehaze-border: #e5e7eb;
  --dehaze-input: #e5e7eb;
  --dehaze-ring: #3b82f6;

  /* State colors */
  --dehaze-state-success: #4caf50;
  --dehaze-state-warning: #ff9800;
  --dehaze-state-error: #f44336;
  --dehaze-state-info: #2196f3;

  /* Radius scale */
  --dehaze-radius-sm: 4px;
  --dehaze-radius-md: 8px;
  --dehaze-radius-lg: 12px;
  --dehaze-radius-xl: 16px;
  --dehaze-radius-full: 9999px;

  /* Typography */
  --dehaze-font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --dehaze-font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;

  /* Shadows */
  --dehaze-shadow-1: 0 2px 8px rgba(0, 0, 0, 0.08);
  --dehaze-shadow-2: 0 4px 12px rgba(0, 0, 0, 0.12);
  --dehaze-shadow-3: 0 8px 24px rgba(0, 0, 0, 0.12);
  --dehaze-shadow-4: 0 12px 24px rgba(0, 0, 0, 0.14);
  --dehaze-shadow-5: 0 16px 32px rgba(0, 0, 0, 0.16);

  /* Spacing */
  --dehaze-space-xs: 4px;
  --dehaze-space-sm: 8px;
  --dehaze-space-md: 16px;
  --dehaze-space-lg: 24px;
  --dehaze-space-xl: 32px;
  --dehaze-space-2xl: 48px;
}

/* Dark mode tokens */
html.dark {
  --dehaze-background: #0f172a;
  --dehaze-foreground: #f9fafb;
  --dehaze-card: #1e293b;
  --dehaze-card-foreground: #f9fafb;
  --dehaze-popover: #1e293b;
  --dehaze-popover-foreground: #f9fafb;
  --dehaze-primary: #60a5fa;
  --dehaze-primary-foreground: #0f172a;
  --dehaze-muted: #1e293b;
  --dehaze-muted-foreground: #94a3b8;
  --dehaze-border: #334155;
  --dehaze-input: #334155;
  --dehaze-ring: #60a5fa;
}

/* Base typography */
body {
  font-family: var(--dehaze-font-sans);
  color: var(--dehaze-foreground);
  background-color: var(--dehaze-background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Heading scale */
.dehaze-heading-hero {
  font-size: clamp(36px, 5vw, 64px);
  line-height: 1.15;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.dehaze-heading-h1 {
  font-size: clamp(28px, 3vw, 40px);
  line-height: 1.2;
  font-weight: 700;
}

.dehaze-heading-h2 {
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.25;
  font-weight: 600;
}

.dehaze-heading-h3 {
  font-size: clamp(18px, 1.8vw, 24px);
  line-height: 1.3;
  font-weight: 600;
}

.dehaze-body {
  font-size: 16px;
  line-height: 1.6;
  font-weight: 400;
}

.dehaze-body-sm {
  font-size: 14px;
  line-height: 1.5;
  font-weight: 400;
}

.dehaze-caption {
  font-size: 12px;
  line-height: 1.4;
  font-weight: 400;
}

/* Buttons */
.dehaze-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: 500;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
}

.dehaze-btn:active {
  transform: scale(0.97);
}

.dehaze-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.dehaze-btn-primary {
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  color: #ffffff;
  border-radius: var(--dehaze-radius-md);
  padding: 12px 24px;
  font-size: 16px;
}

.dehaze-btn-primary:hover {
  box-shadow: var(--dehaze-shadow-3);
  transform: translateY(-1px);
}

.dehaze-btn-secondary {
  background-color: var(--dehaze-neutral-100);
  color: var(--dehaze-neutral-700);
  border-radius: var(--dehaze-radius-md);
  padding: 12px 24px;
  font-size: 16px;
}

.dehaze-btn-secondary:hover {
  background-color: var(--dehaze-neutral-200);
}

.dehaze-btn-ghost {
  background-color: transparent;
  color: var(--dehaze-primary);
  border-radius: var(--dehaze-radius-md);
  padding: 12px 24px;
  font-size: 16px;
}

.dehaze-btn-ghost:hover {
  background-color: var(--dehaze-primary-50);
}

/* Cards */
.dehaze-card {
  background-color: var(--dehaze-card);
  border-radius: var(--dehaze-radius-xl);
  box-shadow: var(--dehaze-shadow-1);
  border: 1px solid var(--dehaze-border);
}

.dehaze-card-hover:hover {
  box-shadow: var(--dehaze-shadow-3);
  transform: translateY(-4px);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

/* Forms */
.dehaze-input {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  font-size: 15px;
  border: 1px solid var(--dehaze-input);
  border-radius: var(--dehaze-radius-md);
  background-color: var(--dehaze-background);
  color: var(--dehaze-foreground);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.dehaze-input:focus {
  outline: none;
  border-color: var(--dehaze-primary);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.dehaze-input::placeholder {
  color: var(--dehaze-muted-foreground);
}

/* Utility gradients */
.dehaze-gradient-primary {
  background: linear-gradient(135deg, #3b82f6, #6366f1);
}

.dehaze-gradient-metric {
  background: linear-gradient(135deg, #667eea, #764ba2);
}

.dehaze-text-gradient {
  background: linear-gradient(135deg, #3b82f6, #6366f1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Status badges */
.dehaze-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: var(--dehaze-radius-full);
  font-size: 12px;
  font-weight: 500;
}

.dehaze-badge-success {
  background-color: rgba(76, 175, 80, 0.12);
  color: #2e7d32;
}

.dehaze-badge-warning {
  background-color: rgba(255, 152, 0, 0.12);
  color: #ef6c00;
}

.dehaze-badge-error {
  background-color: rgba(244, 67, 54, 0.12);
  color: #c62828;
}

.dehaze-badge-info {
  background-color: rgba(33, 150, 243, 0.12);
  color: #1565c0;
}

/* Layout helpers */
.dehaze-container {
  width: 100%;
  max-width: 1280px;
  margin-left: auto;
  margin-right: auto;
  padding-left: var(--dehaze-space-lg);
  padding-right: var(--dehaze-space-lg);
}

.dehaze-surface {
  background-color: var(--dehaze-card);
  border: 1px solid var(--dehaze-border);
  border-radius: var(--dehaze-radius-xl);
}

/* Animation helpers */
@keyframes dehaze-fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.dehaze-animate-fade-in {
  animation: dehaze-fade-in 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background-color: var(--dehaze-neutral-300);
  border-radius: var(--dehaze-radius-full);
}

::-webkit-scrollbar-thumb:hover {
  background-color: var(--dehaze-neutral-400);
}

    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar mb-3">
      <button type="button" class="min-touch px-3 py-1.5 rounded-full text-sm font-medium whitespace-nowrap bg-[var(--dehaze-primary)] text-[var(--dehaze-primary-foreground)]">推荐</button>
      <button type="button" class="min-touch px-3 py-1.5 rounded-full text-sm font-medium whitespace-nowrap bg-[var(--dehaze-muted)] text-[var(--dehaze-neutral-600)]">全部</button>
      <button type="button" class="min-touch px-3 py-1.5 rounded-full text-sm font-medium whitespace-nowrap bg-[var(--dehaze-muted)] text-[var(--dehaze-neutral-600)]">传统</button>
      <button type="button" class="min-touch px-3 py-1.5 rounded-full text-sm font-medium whitespace-nowrap bg-[var(--dehaze-muted)] text-[var(--dehaze-neutral-600)]">深度学习</button>
    </div>
    <div class="space-y-2">
      <label class="flex items-start gap-3 p-3 rounded-xl border border-[var(--dehaze-border)] bg-[var(--dehaze-primary-50)]/40 cursor-pointer min-touch">
        <input type="radio" name="algorithm" value="dcp" checked class="mt-1 w-4 h-4 accent-[var(--dehaze-primary)]" />
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-sm font-semibold text-[var(--dehaze-foreground)]">DCP</span>
            <span class="dehaze-badge dehaze-badge-success">推荐</span>
          </div>
          <p class="dehaze-caption text-[var(--dehaze-muted-foreground)] mt-0.5">暗通道先验，经典快速去雾算法</p>
        </div>
      </label>
      <label class="flex items-start gap-3 p-3 rounded-xl border border-[var(--dehaze-border)] cursor-pointer min-touch hover:bg-[var(--dehaze-muted)]/40 transition">
        <input type="radio" name="algorithm" value="aod-net" class="mt-1 w-4 h-4 accent-[var(--dehaze-primary)]" />
        <div class="flex-1 min-w-0">
          <span class="text-sm font-semibold text-[var(--dehaze-foreground)]">AOD-Net</span>
          <p class="dehaze-caption text-[var(--dehaze-muted-foreground)] mt-0.5">端到端轻量网络，实时性佳</p>
        </div>
      </label>
      <label class="flex items-start gap-3 p-3 rounded-xl border border-[var(--dehaze-border)] cursor-pointer min-touch hover:bg-[var(--dehaze-muted)]/40 transition">
        <input type="radio" name="algorithm" value="ffa-net" class="mt-1 w-4 h-4 accent-[var(--dehaze-primary)]" />
        <div class="flex-1 min-w-0">
          <span class="text-sm font-semibold text-[var(--dehaze-foreground)]">FFA-Net</span>
          <p class="dehaze-caption text-[var(--dehaze-muted-foreground)] mt-0.5">特征融合注意力网络，细节保留好</p>
        </div>
      </label>
      <label class="flex items-start gap-3 p-3 rounded-xl border border-[var(--dehaze-border)] cursor-pointer min-touch hover:bg-[var(--dehaze-muted)]/40 transition">
        <input type="radio" name="algorithm" value="dehamer" class="mt-1 w-4 h-4 accent-[var(--dehaze-primary)]" />
        <div class="flex-1 min-w-0">
          <span class="text-sm font-semibold text-[var(--dehaze-foreground)]">Dehamer</span>
          <p class="dehaze-caption text-[var(--dehaze-muted-foreground)] mt-0.5">Transformer 结构，适应浓雾场景</p>
        </div>
      </label>
      <label class="flex items-start gap-3 p-3 rounded-xl border border-[var(--dehaze-border)] cursor-pointer min-touch hover:bg-[var(--dehaze-muted)]/40 transition">
        <input type="radio" name="algorithm" value="ridcp" class="mt-1 w-4 h-4 accent-[var(--dehaze-primary)]" />
        <div class="flex-1 min-w-0">
          <span class="text-sm font-semibold text-[var(--dehaze-foreground)]">RIDCP</span>
          <p class="dehaze-caption text-[var(--dehaze-muted-foreground)] mt-0.5">真实图像去雾，色彩还原自然</p>
        </div>
      </label>
    </div>
  </section>

  <section class="dehaze-card p-4 mb-4">
    <button type="button" class="w-full flex items-center justify-between min-touch py-1 text-left" aria-expanded="false" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'); document.getElementById('advanced-params').classList.toggle('hidden');">
      <span class="text-base font-semibold text-[var(--dehaze-foreground)]">高级参数</span>
      <svg class="w-5 h-5 text-[var(--dehaze-neutral-500)] transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
    </button>
    <div id="advanced-params" class="hidden mt-4 space-y-4">
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-sm text-[var(--dehaze-foreground)]">亮度</label>
          <span class="dehaze-caption text-[var(--dehaze-muted-foreground)]">0</span>
        </div>
        <input type="range" min="-50" max="50" value="0" class="slider-track" />
      </div>
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-sm text-[var(--dehaze-foreground)]">对比度</label>
          <span class="dehaze-caption text-[var(--dehaze-muted-foreground)]">0</span>
        </div>
        <input type="range" min="-50" max="50" value="0" class="slider-track" />
      </div>
    </div>
  </section>

  <section class="dehaze-card p-4 mb-4 hidden" data-dom-id="progress-card">
    <div class="flex items-center justify-between mb-2">
      <span class="text-sm font-medium text-[var(--dehaze-foreground)]">正在去雾</span>
      <span class="text-sm font-semibold text-[var(--dehaze-primary)]">68%</span>
    </div>
    <div class="w-full h-2 rounded-full bg-[var(--dehaze-neutral-200)] overflow-hidden">
      <div class="h-full rounded-full bg-[var(--dehaze-primary)] transition-all" style="width: 68%"></div>
    </div>
  </section>
</main>

<div class="fixed bottom-[56px] left-0 right-0 z-40 px-4 py-3 bg-[var(--dehaze-background)]/95 backdrop-blur-sm border-t border-[var(--dehaze-border)]">
  <div class="w-full max-w-md mx-auto">
    <button type="button" data-dom-id="cta-start" class="dehaze-btn dehaze-btn-primary w-full min-touch text-base">开始去雾</button>
    <button type="button" data-dom-id="cta-compare" class="dehaze-btn dehaze-btn-secondary w-full min-touch text-base mt-3 hidden">查看对比</button>
  </div>
</div>

>去雾</span></button><button data-nav-key="messages" data-dom-id="nav-messages" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--dehaze-neutral-500)]"><svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">消息</span></button><button data-nav-key="profile" data-dom-id="nav-profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--dehaze-neutral-500)]"><svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></button></div></nav>
