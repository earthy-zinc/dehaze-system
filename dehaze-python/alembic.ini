# Alembic 数据库迁移配置
# 用法：
#   alembic revision --autogenerate -m "描述"
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
script_location = migrations
# sqlalchemy.url 由 env.py 从 app.config 动态获取，无需在此硬编码

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
