[project]
name = "dehaze-python"
version = "1.0.0"
description = "图像去雾系统 API"
requires-python = ">=3.11, <4.0"
dependencies = [
    # FastAPI 异步框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0",
    # 数据库
    "sqlalchemy>=2.0.43",
    "aiomysql>=0.2.0",
    "greenlet>=3.0",
    "pymysql>=1.1.2",
    # 缓存
    "redis>=6.4.0",
    # MongoDB（审计日志）
    "motor>=3.6.0",
    # 对象存储
    "minio>=7.2.18",
    # 安全
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42.0.0",
    # 消息队列
    "aio-pika>=9.4.0",
    # 定时任务
    "pyxxl>=0.4.0",
    # HTTP 客户端
    "httpx>=0.28.1",
    "requests>=2.32.5",
    # Elasticsearch（记忆向量检索 / 会话全文检索）
    # 上限 <9：elasticsearch-py 9.x 客户端向 ES 8.x 服务器发送 Accept: compatible-with=9，
    # 会被 ES 8 拒绝（media_type_header_exception），故需锁定 8.x 客户端版本族
    "elasticsearch[async]>=8.0.0,<9.0.0",
    # LangGraph 推理框架
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    # 图像基础：验证码渲染（auth_service）与图片真实性/分辨率校验（dataset 模块），CPU 型；
    # GPU 推理与质量指标计算已随 dehaze-service/dehaze-modal 迁出
    "pillow>=12.0.0",
    # AI 知识库文档解析（pymupdf/python-docx/pptx/rapidocr 为 CPU 密集型，延迟导入）
    "pymupdf>=1.24",              # PDF 文本提取 + 表格 + 版面 block
    "python-docx>=1.1",           # Word 文档解析
    "python-pptx>=1.0",           # PPT 文档解析
    "tiktoken>=0.8",              # token 计数
    "rapidocr-onnxruntime>=1.3",  # OCR（轻量 CPU 推理）
    # rapidocr 传递引入 opencv；5.x 重写后的 cv2 惰性加载在当前组合下 cvtColor 等核心 API 不可用，锁 4.x
    "opencv-python>=4.10,<5",
    "beautifulsoup4>=4.12.0",     # 知识库 HTML 文档解析（document_parser）
    # LangChain（service/ai 多处顶层直接引用，此前仅靠 deepagents 传递带入）
    "langchain>=1.3.0",
    # 工具
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.1",
    "openpyxl>=3.1.0",
    "mcp>=1.24.0,<2.0.0",
    # Prometheus 监控
    "prometheus-client>=0.21.0",
    "starlette-exporter>=0.23.0",
    "python-json-logger>=4.0.0",
    "deepagents>=0.7.6",
    "langgraph-supervisor>=0.0.31",
    "langchain-mcp-adapters>=0.3.2",
    "croniter>=6.2.4",
    # 本地推理已全部外置为 dehaze-service/*（dehaze-llm / dehaze-voice / dehaze-modal），
    # 编排侧零 GPU/重推理依赖，仅经 HTTP 调用（LOCAL_LLM_BASE_URL / VOICE_ENGINE_BASE_URL / MODAL_ENGINE_BASE_URL）
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",  # 测试全局超时（pytest.ini timeout），防止测试卡死无限挂起
    "faker>=22.0.0",
    "httpx>=0.28.1",
    "respx>=0.22.0",  # httpx 传输层拦截，mock 外部 HTTP 依赖
    "aiosqlite>=0.20.0",  # SQLite 异步驱动（测试用）
    "mongomock>=4.1.2",  # MongoDB 内存模拟
    "mongomock-motor>=0.0.26",  # mongomock 的 motor 兼容层（AsyncMongoMockClient）
    "freezegun>=1.5.0",  # 时间冻结
]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis[lua]>=2.37.1",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.22",
]

# ============ Ruff：lint + format 统一工具（替代 black + isort + flake8）============
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "logs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes（未使用导入/变量等）
    "I",    # isort 导入排序
    "B",    # bugbear 常见 bug 模式
    "UP",   # pyupgrade 语法现代化
    "RET",  # return 语句卫生（消除多余 else 分支、return 后死代码）
    "ISC",  # 隐式字符串拼接检测
    "PT",   # pytest 最佳实践
    "FLY",  # join/format 旧写法 → f-string
    "SIM",  # 常见可简化写法
    "C4",   # comprehensions 推导式现代化
    "RUF",  # ruff 自有规则（含无效 noqa 校验）
    "N",    # PEP 8 命名规范
    "EM",   # 异常消息规范
    "PERF", # 性能反模式
    "PTH",  # os.path → pathlib 现代路径写法
]
ignore = [
    "B008",   # FastAPI Depends() 用作默认参数是官方惯用写法
    "RUF001", # 中文字符串中的全角标点，误报
    "RUF002", # 中文 docstring 中的全角标点，误报
    "RUF003", # 中文注释中的全角标点，误报
    "RUF012", # Pydantic 可变类属性按设计就是字段默认值，不应标 ClassVar
    "EM101",  # 异常消息内联字面量即可，不必强制模块级常量
    "EM102",  # 同上，f-string 异常消息可 grep
    "N803",   # API 契约字段 camelCase（pageNum/dataSetId 等），与 snake_case 规范冲突
    "N815",   # 同上，Pydantic 响应模型的 camelCase 字段（API 契约，禁止改名）
    "N818",   # 异常类名沿用跨端统一约定（BusinessException/TaskCancelledException，java/go/SDK 同名）
    "N999",   # 目录名 dehaze-python 含连字符导致的模块名推断误报
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# Pydantic 模型存在字段名 list（API 契约），遮蔽内建类型后注解必须用 typing.List
[tool.ruff.lint.per-file-ignores]
"app/models/schema/common.py" = ["UP006", "UP035"]
"app/models/schema/task.py" = ["UP006", "UP035"]
"app/models/schema/dataset.py" = ["UP006", "UP035"]
"app/models/schema/file.py" = ["UP006", "UP035"]
# config.py 用全大写 @property 模拟配置常量（DATABASE_URL 等），属命名惯例
"app/config.py" = ["N802"]
# 路由中 test_agent 等"测试预览"端点以 test_ 开头，被 PT028 误判为 pytest 测试函数
"app/router/**" = ["PT028"]
