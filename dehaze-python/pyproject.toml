[project]
name = "dehaze-python"
version = "1.0.0"
description = "图像去雾系统 API"
requires-python = ">=3.11, <4.0"
dependencies = [
    # FastAPI 异步框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0",
    # 数据库
    "sqlalchemy>=2.0.43",
    "aiomysql>=0.2.0",
    "greenlet>=3.0",
    "pymysql>=1.1.2",
    "alembic>=1.13.0",
    # 缓存
    "redis>=6.4.0",
    # MongoDB（审计日志）
    "motor>=3.6.0",
    # 对象存储
    "minio>=7.2.18",
    # 安全
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42.0.0",
    # 消息队列
    "aio-pika>=9.4.0",
    # 定时任务
    "pyxxl>=0.4.0",
    # HTTP 客户端
    "httpx>=0.28.1",
    "requests>=2.32.5",
    # Elasticsearch（记忆向量检索 / 会话全文检索）
    # 上限 <9：elasticsearch-py 9.x 客户端向 ES 8.x 服务器发送 Accept: compatible-with=9，
    # 会被 ES 8 拒绝（media_type_header_exception），故需锁定 8.x 客户端版本族
    "elasticsearch[async]>=8.0.0,<9.0.0",
    # LangGraph 推理框架
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    # 深度学习
    # PyTorch CUDA 版本通过 [tool.uv.sources] 指向 PyTorch 官方 CUDA 源
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "pillow>=12.0.0",
    # 算法常用库
    "numpy>=1.26.0",
    "opencv-python>=4.10.0",
    "timm>=1.0.0",
    "einops>=0.8.0",
    "thop>=0.1.1",
    "yacs>=0.1.8",
    # 图像质量评估（PSNR/SSIM/LPIPS/NIQE 等）
    "pyiqa>=0.1.0",
    # 可视化（lr_scheduler 等模块延迟导入）
    "matplotlib>=3.8.0",
    # CFENViTDehazing 数据获取脚本使用
    "beautifulsoup4>=4.12.0",
    # AI 知识库文档解析（pymupdf/python-docx/pptx/rapidocr 为 CPU 密集型，延迟导入）
    "pymupdf>=1.24",              # PDF 文本提取 + 表格 + 版面 block
    "python-docx>=1.1",           # Word 文档解析
    "python-pptx>=1.0",           # PPT 文档解析
    "tiktoken>=0.8",              # token 计数
    "rapidocr-onnxruntime>=1.3",  # OCR（轻量 CPU 推理）
    # ImgRestorationSde EMA 模型
    "ema-pytorch>=0.1.0",
    # CUDA 算子编译依赖（RIDCP/WPXNet 等 DCN 模块 torch.utils.cpp_extension.load 需要）
    "setuptools>=80.0.0",
    "ninja>=1.11.0",
    # WPXNet Neighborhood Attention（仅 Linux 有预编译 wheel，Windows 需 WSL2）
    "natten==0.21.5+torch290cu128; sys_platform == 'linux'",
    # 语音交互 ASR 引擎（funasr 本地推理，CPU 密集，延迟导入；模型自动从 ModelScope 下载缓存）
    "funasr>=1.2.0",
    "modelscope>=1.20.0",
    "torchaudio>=2.9.0",
    # LangChain（service/ai 多处顶层直接引用，此前仅靠 deepagents 传递带入）
    "langchain>=1.3.0",
    # 工具
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.1",
    "openpyxl>=3.1.0",
    "mcp>=1.24.0",
    # Prometheus 监控
    "prometheus-client>=0.21.0",
    "starlette-exporter>=0.23.0",
    # GPU 监控
    "nvidia-ml-py>=11.5.0",
    "python-json-logger>=4.0.0",
    "deepagents>=0.7.6",
    "langgraph-supervisor>=0.0.31",
    "langchain-mcp-adapters>=0.3.2",
    "croniter>=6.2.4",
    # 跨平台基线：lock 锁定 PyPI sdist，uv sync 各平台本地编译（CPU 版，按本机指令集生成）。
    # Linux + NVIDIA GPU 加速需源码编译 CUDA 版覆盖安装（详见 docs 03-模块设计/AI对话/后端实现-模型管理.md §2.13）：
    #   uv cache clean llama-cpp-python
    #   CMAKE_ARGS="-DGGML_CUDA=on -DCMAKE_CUDA_HOST_COMPILER=/usr/bin/g++-11" uv pip install \
    #     --python .venv/bin/python --no-deps --no-binary llama-cpp-python --force-reinstall llama-cpp-python==0.3.35
    # （官方 cu121 wheel 在 12-14 代 Intel 消费级 CPU 上会 SIGILL 崩溃，不可用）
    "llama-cpp-python>=0.3,<0.4",
    # 语音交互 TTS 引擎（Piper 本地推理，CPU 密集，延迟导入；模型自动从 hf-mirror 下载缓存，
    # lameenc 为 MP3 编码依赖；pathvalidate 由 piper-tts 传递引入）
    "piper-tts>=1.6",
    "lameenc>=1.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-mock>=3.14.0",
    "faker>=22.0.0",
    "httpx>=0.28.1",
    "respx>=0.22.0",  # httpx 传输层拦截，mock 外部 HTTP 依赖
    "aiosqlite>=0.20.0",  # SQLite 异步驱动（测试用）
    "mongomock>=4.1.2",  # MongoDB 内存模拟
    "mongomock-motor>=0.0.26",  # mongomock 的 motor 兼容层（AsyncMongoMockClient）
    "freezegun>=1.5.0",  # 时间冻结
]
# 本地 LLM 服务（local_llm_server，可选降级方案：需手动下载 GGUF 模型，见 scripts/download_local_llm.py）
local-llm = [
    "llama-cpp-python>=0.3.0",
]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"
find-links = ["https://whl.natten.org/"]

# PyTorch CUDA 版本源（GPU 版本）
# 阿里云镜像默认提供 CPU 版本 wheel，需从 PyTorch 官方源获取 CUDA 版本
# cu128 源提供 torch 2.9.x Windows/Linux wheel；驱动 610.62 支持 CUDA 13.3，向下兼容 cu128
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis[lua]>=2.37.1",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
]

# ============ Ruff：lint + format 统一工具（替代 black + isort + flake8）============
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "algorithm",   # 论文复现代码，保持与官方仓库结构一致，不格式化
    "migrations",  # alembic 自动生成，不格式化
    "logs",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes（未使用导入/变量等）
    "I",  # isort 导入排序
    "B",  # bugbear 常见 bug 模式
    "UP", # pyupgrade 语法现代化
]
ignore = [
    "B008", # FastAPI Depends() 用作默认参数是官方惯用写法
]

[tool.ruff.lint.isort]
known-first-party = ["app", "algorithm"]

# Pydantic 模型存在字段名 list（API 契约），遮蔽内建类型后注解必须用 typing.List
[tool.ruff.lint.per-file-ignores]
"app/models/schema/common.py" = ["UP006", "UP035"]
"app/models/schema/task.py" = ["UP006", "UP035"]
"app/models/schema/dataset.py" = ["UP006", "UP035"]
"app/models/schema/file.py" = ["UP006", "UP035"]
