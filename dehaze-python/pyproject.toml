[project]
name = "dehaze-python"
version = "1.0.0"
description = "图像去雾系统 API"
requires-python = ">=3.10"
dependencies = [
    # FastAPI 异步框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0",
    # 数据库
    "sqlalchemy>=2.0.43",
    "aiomysql>=0.2.0",
    "greenlet>=3.0",
    "pymysql>=1.1.2",
    # 缓存
    "redis>=6.4.0",
    # 对象存储
    "minio>=7.2.18",
    # 安全
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3",
    # 消息队列
    "aio-pika>=9.4.0",
    # 定时任务
    "pyxxl>=0.4.0",
    # HTTP 客户端
    "httpx>=0.28.1",
    "requests>=2.32.5",
    # 深度学习
    # PyTorch CUDA 版本通过 [tool.uv.sources] 指向 PyTorch 官方 CUDA 12.1 源
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "pillow>=12.0.0",
    # CUDA 算子编译依赖（RIDCP/WPXNet 等 DCN 模块 torch.utils.cpp_extension.load 需要）
    "setuptools>=80.0.0",
    "ninja>=1.11.0",
    # 工具
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.1",
    "openpyxl>=3.1.0",
    "mcp>=1.24.0",
    # Prometheus 监控
    "prometheus-client>=0.21.0",
    "starlette-exporter>=0.23.0",
    # GPU 监控
    "pynvml>=11.5.0",
    "python-json-logger>=4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "faker>=22.0.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.20.0",  # SQLite 异步驱动（测试用）
]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

# PyTorch CUDA 版本源（GPU 版本）
# 阿里云镜像默认提供 CPU 版本 wheel，需从 PyTorch 官方源获取 CUDA 版本
# cu128 源提供 torch 2.9.x Windows/Linux wheel；驱动 610.62 支持 CUDA 13.3，向下兼容 cu128
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
