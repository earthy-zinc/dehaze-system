[project]
name = "dehaze-python"
version = "1.0.0"
description = "图像去雾系统 API"
requires-python = ">=3.10"
dependencies = [
    # FastAPI 异步框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0",
    # 数据库
    "sqlalchemy>=2.0.43",
    "aiomysql>=0.2.0",
    "greenlet>=3.0",
    "pymysql>=1.1.2",
    # 缓存
    "redis>=6.4.0",
    # 对象存储
    "minio>=7.2.18",
    # 安全
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3",
    # 消息队列
    "aio-pika>=9.4.0",
    # 定时任务
    "pyxxl>=0.4.0",
    # HTTP 客户端
    "httpx>=0.28.1",
    "requests>=2.32.5",
    # 深度学习
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "pillow>=12.0.0",
    # 工具
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.1",
    "openpyxl>=3.1.0",
    "mcp>=1.24.0",
    # Prometheus 监控
    "prometheus-client>=0.21.0",
    "starlette-exporter>=0.23.0",
    # GPU 监控
    "pynvml>=11.5.0",
    "python-json-logger>=4.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "faker>=22.0.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.20.0",  # SQLite 异步驱动（测试用）
]

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"
