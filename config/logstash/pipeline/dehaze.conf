# Dehaze 三端结构化日志采集管道
# 链路：三端 logs/{yyyy-MM-dd}/*.log → Filebeat(NDJSON 解析) → Logstash → ES(dehaze-logs-*)
# 日志规范见 dehaze-doc/docs/02-系统架构/06-部署架构.md 7.4
#
# 三端日志字段差异（动态映射易冲突，需在下方归一化）：
#   - 时间戳：Java @timestamp（Filebeat 自动识别）；Go/Python timestamp（date 过滤器对齐）
#   - error：Filebeat 对非 JSON 行注入 error.message（对象）；Go zap 输出字符串
#   - taskID：Go 中同时存在数值型与 UUID 字符串型
#   - thread：Java 为字符串；Python 为数字

input {
  beats {
    port => 5044
  }
}

filter {
  # Filebeat 已完成 NDJSON 解析，trace_id / user_id / level / message 等字段位于根层级。
  # 对非 JSON 行（如 console.log），Filebeat 保留原始 message，此处跳过 JSON 解析避免报错。
  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }

  # 事件时间对齐：Go 格式 2026-07-30T00:30:08.119+0800；Python 为 ISO8601
  if [timestamp] {
    date {
      match => ["timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "ISO8601"]
    }
  }

  # 字段类型归一化，避免 ES 动态映射冲突导致文档写入失败
  ruby {
    code => '
      err = event.get("error")
      if err.is_a?(String)
        event.set("error", { "message" => err })
      end
      ["taskID", "thread"].each do |field|
        val = event.get(field)
        if val.is_a?(Numeric)
          event.set(field, val.to_s)
        end
      end
    '
  }

  # 清理采集器附加的噪音字段，保持 ES 文档精简
  mutate {
    remove_field => ["agent", "ecs", "input", "host", "[log][offset]", "timestamp"]
  }
}

output {
  # 前端日志（filebeat fields.service=client）分流到独立索引，便于 Kibana 独立检索与监控
  if [service] == "client" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      # ES 已启用 xpack security，需带账号密码
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      index => "dehaze-client-logs-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      # ES 已启用 xpack security，需带账号密码
      user => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      index => "dehaze-logs-%{+YYYY.MM.dd}"
    }
  }
}
