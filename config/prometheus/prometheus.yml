global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Java 后端 (Spring Boot Actuator)
  - job_name: 'dehaze-java'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8989' ]
        labels:
          service: 'java'

  # Python 后端 (FastAPI)
  - job_name: 'dehaze-python'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'host.docker.internal:8991' ]
        labels:
          service: 'python'

  # Go 后端
  - job_name: 'dehaze-go'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'host.docker.internal:8990' ]
        labels:
          service: 'go'

  # Node Exporter (宿主机 CPU/内存/磁盘)
  - job_name: 'node'
    static_configs:
      - targets: [ 'node-exporter:9100' ]

  # MySQL Exporter
  - job_name: 'mysql'
    static_configs:
      - targets: [ 'mysqld-exporter:9104' ]

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: [ 'redis-exporter:9121' ]

  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9091' ]
