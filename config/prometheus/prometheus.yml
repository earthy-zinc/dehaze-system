global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'springboot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8989' ] # Spring Boot Actuator 端口（host.docker.internal 用于访问宿主机服务）
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9091' ]
