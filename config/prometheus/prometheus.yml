global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则（阈值见 dehaze-doc 06-部署架构.md 7.2）
rule_files:
  - /etc/prometheus/rules/*.yml

# 告警通知通道
alerting:
  alertmanagers:
    - static_configs:
        - targets: [ 'alertmanager:9093' ]
      # Alertmanager 已启用 Basic Auth，账号 admin / 密码由 prometheus 容器启动时
      # 从 __ALERTMANAGER_PASSWORD__ 占位符替换为 ${ALERTMANAGER_PASSWORD}（prometheus.yml 不支持环境变量）
      basic_auth:
        username: admin
        password: __ALERTMANAGER_PASSWORD__

scrape_configs:
  # Java 后端 (Spring Boot Actuator)
  - job_name: 'dehaze-java'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8989' ]
        labels:
          service: 'java'

  # Python 后端 (FastAPI)
  - job_name: 'dehaze-python'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'host.docker.internal:8991' ]
        labels:
          service: 'python'

  # Go 后端
  - job_name: 'dehaze-go'
    metrics_path: '/metrics'
    static_configs:
      - targets: [ 'host.docker.internal:8990' ]
        labels:
          service: 'go'

  # Node Exporter (宿主机 CPU/内存/磁盘)
  - job_name: 'node'
    static_configs:
      - targets: [ 'node-exporter:9100' ]

  # MySQL Exporter
  - job_name: 'mysql'
    static_configs:
      - targets: [ 'mysqld-exporter:9104' ]

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: [ 'redis-exporter:9121' ]

  # MongoDB Exporter
  - job_name: 'mongodb'
    static_configs:
      - targets: [ 'mongodb-exporter:9216' ]

  # RabbitMQ 内置 prometheus 插件
  - job_name: 'rabbitmq'
    static_configs:
      - targets: [ 'rabbitmq:15692' ]

  # MinIO 内置指标端点（MINIO_PROMETHEUS_AUTH_TYPE=public）
  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: [ 'minio:9000' ]

  # GPU DCGM Exporter（需 NVIDIA GPU + nvidia-container-toolkit，
  # 通过 docker compose --profile gpu up -d dcgm-exporter 启动）
  - job_name: 'gpu'
    static_configs:
      - targets: [ 'dcgm-exporter:9400' ]

  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9091' ]
