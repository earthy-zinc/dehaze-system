server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    # 允许大文件响应
    client_max_body_size 100m;

    # CORS 跨域配置
    # Web 前端（如 http://127.0.0.1:5177 Flutter Web、http://127.0.0.1:5173 React 等）
    # 直接通过 <img> / fetch() 访问数据集图片时，浏览器要求静态服务返回 CORS 响应头。
    # 数据集图片为公开只读资源，使用通配符 * 即可（不携带 Cookie 凭证）。
    # 必须放在 server 块顶层，避免被 location 块内的 add_header 覆盖丢失。
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range" always;
    add_header Access-Control-Max-Age 86400 always;

    # 处理 CORS 预检请求（OPTIONS）。
    # 注意：add_header 不能放在 server 上下文的 if 块里（nginx 限制），
    # 必须放到 location 块内才能生效。
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }
        try_files $uri =404;
    }

    # 图片缓存
    location ~* \.(jpg|jpeg|png|gif|bmp|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
