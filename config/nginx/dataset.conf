server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    # 允许大文件响应
    client_max_body_size 100m;

    # 图片缓存
    location ~* \.(jpg|jpeg|png|gif|bmp|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 默认location：直接服务文件
    location / {
        try_files $uri =404;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
