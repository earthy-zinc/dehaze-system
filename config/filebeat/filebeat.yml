# Filebeat 三端日志采集配置
# 挂载约定（见 docker-compose.yml filebeat 服务）：
#   /logs/java    → clarity-java/logs
#   /logs/python  → clarity-python/logs
#   /logs/go      → clarity-go/logs
# 目录结构为 logs/{yyyy-MM-dd}/{级别}.log，三端均为 JSON 结构化日志

filebeat.inputs:
  - type: filestream
    id: clarity-java
    enabled: true
    paths:
      - /logs/java/*/*.log
    parsers:
      - ndjson:
          keys_under_root: true
          add_error_key: true
    fields:
      service: java
    fields_under_root: true

  - type: filestream
    id: clarity-python
    enabled: true
    paths:
      - /logs/python/*/*.log
    parsers:
      - ndjson:
          keys_under_root: true
          add_error_key: true
    fields:
      service: python
    fields_under_root: true

  - type: filestream
    id: clarity-go
    enabled: true
    paths:
      - /logs/go/*/*.log
    parsers:
      - ndjson:
          keys_under_root: true
          add_error_key: true
    fields:
      service: go
    fields_under_root: true

  # 外置推理服务（clarity-service/*）：fields.service 与日志实现约定的服务名一致
  - type: filestream
    id: clarity-llm
    enabled: true
    paths:
      - /logs/llm/*/*.log
    parsers:
      - ndjson:
          keys_under_root: true
          add_error_key: true
    fields:
      service: llm
    fields_under_root: true

  - type: filestream
    id: clarity-voice
    enabled: true
    paths:
      - /logs/voice/*/*.log
    parsers:
      - ndjson:
          keys_under_root: true
          add_error_key: true
    fields:
      service: voice
    fields_under_root: true

  - type: filestream
    id: clarity-modal
    enabled: true
    paths:
      - /logs/modal/*/*.log
    parsers:
      - ndjson:
          keys_under_root: true
          add_error_key: true
    fields:
      service: modal
    fields_under_root: true

  - type: filestream
    id: dehaze-client
    enabled: true
    paths:
      - /logs/java/*/client.log    # 挂载 clarity-java/logs，前端日志由后端接收 API 落盘
    parsers:
      - ndjson:
          keys_under_root: true
          add_error_key: true
    fields:
      service: client              # 区分后端日志，供 logstash 分流
    fields_under_root: true

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_stderr: true
