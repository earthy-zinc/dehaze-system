apiVersion: batch/v1
kind: Job
metadata:
  name: dehaze-test-smoke-modal
  namespace: p-cloud-dev-test-perm-resource-5aesj19quwkg
  labels:
    app: dehaze-test
    phase: smoke
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: dehaze-test
        phase: smoke
        backend: modal
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: csighub-registry
      volumes:
        - name: env-file
          secret:
            secretName: dehaze-test-env
      containers:
        - name: modal
          image: csighub.tencentyun.com/earthywu/dehaze-system:modal-test-fe62ad390
          imagePullPolicy: Always
          workingDir: /app/dehaze-service/dehaze-modal
          resources:
            requests: {cpu: "500m", memory: 2Gi}
            limits: {cpu: "4", memory: 8Gi}
          volumeMounts:
            - name: env-file
              mountPath: /app/.env
              subPath: .env
              readOnly: true
          command: ["bash", "-c"]
          args:
            - |
              export PATH="/usr/local/bin:$PATH"
              # 真实跑通 algorithm.DCP（无权重、纯 numpy/opencv）：镜像 → importlib 装载 → 返回 PNG
              .venv/bin/python -m pytest tests/test_inference_api.py::test_inference_runs_weightless_algorithm -q --no-header > /tmp/smoke-modal.log 2>&1
              rc=$?
              tail -30 /tmp/smoke-modal.log
              exit $rc
