# 三推理服务全量单测回归（第 2 批）：dehaze-llm / dehaze-voice / dehaze-modal
#
#   kubectl apply -f config/kube/test/job-services.yaml -n p-cloud-dev-test-perm-resource-5aesj19quwkg
#   kubectl logs -n $NS job/dehaze-test-regression-llm      # / -voice / -modal
#   kubectl delete job dehaze-test-regression-llm dehaze-test-regression-voice dehaze-test-regression-modal -n $NS
#
# 前置（镜像构建与两个 Secret）见 job-smoke.yaml 头部注释。
# **不得与 job-regression.yaml 同时 apply**：组织配额 32C/32G 按 limits 累加，
#   本文件合计 10C/20G，三端文件合计 22C/26G，同跑必然超限（admission webhook denied）。
#
# 三个服务都不依赖 MySQL/Redis/ES/MinIO，也不需要 GPU 与真实权重：
#   conftest 以桩替换推理引擎（llama_cpp / piper / ASR），权重目录被 monkeypatch 到 tmp_path；
#   modal 的 test_inference_runs_weightless_algorithm 会真实执行 algorithm.DCP（纯 numpy/opencv）。
# 服务读仓库根 .env（app/config.py 以 pyproject.toml 向上探测服务根、取 parents[1] 作仓库根），
# 容器内即 /app/.env，故与三端一样用 dehaze-test-env Secret 挂载。
apiVersion: batch/v1
kind: Job
metadata:
  name: dehaze-test-regression-llm
  namespace: p-cloud-dev-test-perm-resource-5aesj19quwkg
  labels:
    app: dehaze-test
    phase: regression
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        app: dehaze-test
        phase: regression
        backend: llm
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: csighub-registry
      volumes:
        - name: env-file
          secret:
            secretName: dehaze-test-env
      containers:
        - name: llm
          image: csighub.tencentyun.com/earthywu/dehaze-system:llm-test-fe62ad390
          imagePullPolicy: Always
          workingDir: /app/dehaze-service/dehaze-llm
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - name: env-file
              mountPath: /app/.env
              subPath: .env
              readOnly: true
          command: ["bash", "-c"]
          args:
            - |
              export PATH="/usr/local/bin:$PATH"
              .venv/bin/python -m pytest -q --no-header 2>&1 | tee /tmp/llm.log
              rc=${PIPESTATUS[0]}
              echo "==== SUMMARY ===="
              echo "失败用例数: $(grep -cE '^(FAILED|ERROR) ' /tmp/llm.log)"
              grep -E "^(FAILED|ERROR) " /tmp/llm.log | head -40
              echo "---- 结果统计 ----"; tail -5 /tmp/llm.log
              echo "==== END SUMMARY ===="
              echo "LLM_EXIT=$rc"
              exit $rc
---
