basePath: /api/v1
definitions:
  bo.DatasetFormBO:
    properties:
      createTime:
        description: 创建时间
        type: string
      description:
        description: 数据集描述
        type: string
      id:
        description: 数据集ID
        type: integer
      name:
        description: 数据集名称
        type: string
      parentId:
        description: 父数据集ID
        type: integer
      path:
        description: 数据集存储路径
        type: string
      statistics:
        allOf:
        - $ref: '#/definitions/bo.StatisticsBO'
        description: 统计信息
      status:
        description: 状态(1:正常;0:禁用) - 支持字符串和数字类型
        type: integer
      type:
        description: 数据集类型
        type: string
      updateTime:
        description: 更新时间
        type: string
    required:
    - parentId
    type: object
  bo.DeptFormBO:
    properties:
      id:
        description: 部门ID
        type: integer
      name:
        description: 部门名称
        type: string
      parentId:
        description: 父部门ID
        type: integer
      sort:
        description: 排序(数字越小排名越靠前)
        type: integer
      status:
        description: 状态(1:启用;0:禁用)
        type: integer
    required:
    - name
    - parentId
    type: object
  bo.DictFormBO:
    properties:
      id:
        description: 字典ID
        type: integer
      name:
        description: 字典名称
        type: string
      remark:
        description: 字典备注
        type: string
      sort:
        description: 排序
        type: integer
      status:
        description: 状态(1:启用;0:禁用)
        type: integer
      typeCode:
        description: 类型编码
        type: string
      value:
        description: 字典值
        type: string
    type: object
  bo.DictTypeFormBO:
    properties:
      code:
        description: 类型编码
        type: string
      id:
        description: 字典类型ID
        type: integer
      name:
        description: 类型名称
        type: string
      remark:
        description: 备注
        type: string
      status:
        description: 类型状态(1:启用;0:禁用)
        type: integer
    type: object
  bo.MenuForm:
    properties:
      alwaysShow:
        description: 【目录】只有一个子路由是否始终显示(1:是 0:否)
        type: integer
      component:
        description: 组件路径(vue页面完整路径，省略.vue后缀)
        type: string
      icon:
        description: 菜单图标
        type: string
      id:
        description: 菜单ID
        type: integer
      keepAlive:
        description: 【菜单】是否开启页面缓存(1:开启;0:关闭)
        type: integer
      name:
        description: 菜单名称
        type: string
      parentId:
        description: 父菜单ID
        type: integer
      path:
        description: 路由路径
        type: string
      perm:
        description: 权限标识
        type: string
      redirect:
        description: 跳转路径
        type: string
      sort:
        description: 排序(数字越小排名越靠前)
        type: integer
      type:
        description: 菜单类型(1-菜单；2-目录；3-外链；4-按钮权限)
        type: integer
      visible:
        description: 显示状态(1:显示;0:隐藏)
        type: integer
    type: object
  bo.RoleFormBO:
    properties:
      code:
        description: 角色编码
        type: string
      dataScope:
        description: 数据权限
        type: integer
      id:
        description: 角色ID
        type: integer
      name:
        description: 角色名称
        type: string
      sort:
        description: 排序
        type: integer
      status:
        description: 角色状态(1-正常；0-停用)
        type: integer
    required:
    - code
    - name
    type: object
  bo.StatisticsBO:
    properties:
      clearCount:
        type: integer
      fileCount:
        type: integer
      formatDistribution:
        additionalProperties:
          format: int64
          type: integer
        type: object
      hazeDistribution:
        additionalProperties:
          format: int64
          type: integer
        type: object
      hazyCount:
        type: integer
      itemCount:
        type: integer
      sceneDistribution:
        additionalProperties:
          format: int64
          type: integer
        type: object
      totalSize:
        type: integer
    type: object
  bo.UserFormBO:
    properties:
      avatar:
        description: 用户头像
        type: string
      deptId:
        description: 部门ID
        type: integer
      email:
        description: 用户邮箱
        type: string
      gender:
        description: 性别(1:男;2:女)
        type: integer
      id:
        description: 用户ID
        type: integer
      mobile:
        description: 手机号
        type: string
      nickname:
        description: 用户昵称
        type: string
      roleIds:
        description: 角色ID集合
        items:
          type: integer
        type: array
      status:
        description: 状态(1:启用;0:禁用)
        type: integer
      username:
        description: 用户名
        type: string
    type: object
  common.PageResult:
    properties:
      list: {}
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  common.Response:
    properties:
      code:
        type: string
      data: {}
      msg:
        type: string
    type: object
  dto.ImageFileInfo:
    properties:
      datasetItemId:
        description: 所属数据项id
        type: integer
      description:
        description: 文件描述
        type: string
      fileId:
        description: 所属文件id
        type: integer
      id:
        description: 当前图片id
        type: integer
      type:
        description: 图片类型
        type: string
      url:
        description: 文件URL
        type: string
    type: object
  model.SysFile:
    properties:
      createTime:
        type: string
      id:
        type: integer
      md5:
        type: string
      name:
        type: string
      objectName:
        type: string
      path:
        type: string
      size:
        type: string
      type:
        type: string
      updateTime:
        type: string
      url:
        type: string
    type: object
  vo.DatasetVO:
    properties:
      children:
        description: 子数据集
        items:
          $ref: '#/definitions/vo.DatasetVO'
        type: array
      createTime:
        description: 创建时间
        type: string
      description:
        description: 数据集描述
        type: string
      id:
        description: 数据集ID
        type: integer
      name:
        description: 数据集名称
        type: string
      parentId:
        description: 父数据集ID
        type: integer
      path:
        description: 存储位置
        type: string
      size:
        description: 占用空间大小
        type: string
      status:
        description: 状态(1:启用；0:禁用)
        type: integer
      type:
        description: 数据集类型
        type: string
      updateTime:
        description: 修改时间
        type: string
    type: object
  vo.DeptVO:
    properties:
      children:
        description: 子部门
        items:
          $ref: '#/definitions/vo.DeptVO'
        type: array
      createTime:
        description: 创建时间
        type: string
      id:
        description: 部门ID
        type: integer
      name:
        description: 部门名称
        type: string
      parentId:
        description: 父部门ID
        type: integer
      sort:
        description: 排序
        type: integer
      status:
        description: 状态(1:启用；0:禁用)
        type: integer
      updateTime:
        description: 修改时间
        type: string
    type: object
  vo.ImageItemVO:
    properties:
      createTime:
        description: 创建时间
        type: string
      datasetId:
        description: 数据集ID
        type: integer
      hazyImages:
        description: 模糊图片
        items:
          $ref: '#/definitions/vo.ImageUrlVO'
        type: array
      id:
        description: 数据项ID
        type: integer
      imageCount:
        description: 图片数量
        type: integer
      name:
        description: 数据项名称
        type: string
      updateTime:
        description: 更新时间
        type: string
    type: object
  vo.ImageUrlVO:
    properties:
      description:
        type: string
      id:
        description: ItemFileId
        type: integer
      originUrl:
        type: string
      type:
        type: string
      url:
        type: string
    type: object
  vo.ImportFailureVO:
    properties:
      message:
        description: 错误信息
        type: string
      row:
        description: 行号
        type: integer
      username:
        description: 用户名
        type: string
    type: object
  vo.ImportResultVO:
    properties:
      failed:
        description: 失败数
        type: integer
      failures:
        description: 失败明细
        items:
          $ref: '#/definitions/vo.ImportFailureVO'
        type: array
      success:
        description: 成功数
        type: integer
      total:
        description: 总数
        type: integer
    type: object
  vo.MenuVO:
    properties:
      children:
        description: 子菜单
        items:
          $ref: '#/definitions/vo.MenuVO'
        type: array
      component:
        description: 组件路径
        type: string
      icon:
        description: ICON
        type: string
      id:
        description: 菜单ID
        type: integer
      name:
        description: 菜单名称
        type: string
      parentId:
        description: 父菜单ID
        type: integer
      path:
        description: 路由路径
        type: string
      perm:
        description: 按钮权限标识
        type: string
      redirect:
        description: 跳转路径
        type: string
      sort:
        description: 菜单排序(数字越小排名越靠前)
        type: integer
      visible:
        description: 菜单是否可见(1:显示;0:隐藏)
        type: integer
    type: object
  vo.Option:
    properties:
      children:
        description: 子选项列表
        items:
          $ref: '#/definitions/vo.Option'
        type: array
      label:
        description: 选项的标签
        type: string
      value:
        description: 选项的值
    type: object
  vo.RouteMeta:
    properties:
      alwaysShow:
        description: 【目录】只有一个子路由是否始终显示
        type: boolean
      hidden:
        description: 是否隐藏(true-是 false-否)
        type: boolean
      icon:
        description: ICON
        type: string
      keepAlive:
        description: 【菜单】是否开启页面缓存
        type: boolean
      roles:
        description: 拥有路由权限的角色编码
        items:
          type: string
        type: array
      title:
        description: 路由title
        type: string
    type: object
  vo.RouteVO:
    properties:
      children:
        description: 子路由列表
        items:
          $ref: '#/definitions/vo.RouteVO'
        type: array
      component:
        description: 组件路径
        type: string
      meta:
        allOf:
        - $ref: '#/definitions/vo.RouteMeta'
        description: 路由属性
      name:
        description: 路由名称
        type: string
      path:
        description: 路由路径
        type: string
      redirect:
        description: 跳转链接
        type: string
    type: object
  vo.UserExportVO:
    properties:
      createTime:
        description: 创建时间
        type: string
      deptName:
        description: 部门
        type: string
      email:
        description: 邮箱
        type: string
      gender:
        description: 性别
        type: string
      mobile:
        description: 手机号码
        type: string
      nickname:
        description: 用户昵称
        type: string
      statusLabel:
        description: 状态(1:启用;0:禁用)
        type: string
      username:
        description: 用户名
        type: string
    type: object
  vo.UserInfoVO:
    properties:
      avatar:
        description: 头像地址
        type: string
      nickname:
        description: 用户昵称
        type: string
      perms:
        description: 用户权限标识集合
        items:
          type: string
        type: array
      roles:
        description: 用户角色编码集合
        items:
          type: string
        type: array
      userId:
        description: 用户ID
        type: integer
      username:
        description: 用户名
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@dehaze.com
    name: API Support
  description: 去雾系统后端 API 接口文档
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Dehaze System API
  version: "1.0"
paths:
  /api/v1/dataset:
    delete:
      consumes:
      - application/json
      description: 删除数据集
      parameters:
      - description: 数据集ID，多个以英文逗号(,)分割
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 删除数据集
      tags:
      - 数据集接口
    get:
      consumes:
      - application/json
      description: 获取数据集树形列表
      parameters:
      - description: 关键字
        in: query
        name: keywords
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/vo.DatasetVO'
                  type: array
              type: object
      summary: 数据集树形列表
      tags:
      - 数据集接口
    post:
      consumes:
      - application/json
      description: 新增数据集
      parameters:
      - description: 数据集表单数据
        in: body
        name: datasetForm
        required: true
        schema:
          $ref: '#/definitions/bo.DatasetFormBO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/bo.DatasetFormBO'
              type: object
      summary: 新增数据集
      tags:
      - 数据集接口
  /api/v1/dataset-items:
    get:
      consumes:
      - application/json
      description: 分页查询数据项列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: pageNum
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 数据集ID
        in: query
        name: datasetId
        type: integer
      - description: 场景类型
        in: query
        name: sceneType
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/vo.ImageItemVO'
                  type: array
              type: object
      summary: 分页查询数据项列表
      tags:
      - 数据集项接口
  /api/v1/dataset-items/{id}:
    get:
      consumes:
      - application/json
      description: 根据ID获取数据项详情
      parameters:
      - description: 数据项ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 获取数据项详情
      tags:
      - 数据集项接口
  /api/v1/dataset/{id}:
    put:
      consumes:
      - application/json
      description: 修改数据集
      parameters:
      - description: 数据集ID
        in: path
        name: id
        required: true
        type: integer
      - description: 数据集表单数据
        in: body
        name: datasetForm
        required: true
        schema:
          $ref: '#/definitions/bo.DatasetFormBO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 修改数据集
      tags:
      - 数据集接口
  /api/v1/dataset/{id}/form:
    get:
      consumes:
      - application/json
      description: 获取数据集表单数据
      parameters:
      - description: 数据集ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/bo.DatasetFormBO'
              type: object
      summary: 数据集表单数据
      tags:
      - 数据集接口
  /api/v1/dataset/image:
    delete:
      consumes:
      - application/json
      description: 删除数据项图片
      parameters:
      - description: 数据项文件ID
        in: query
        name: itemFileId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 删除数据项图片
      tags:
      - 数据集项接口
    post:
      consumes:
      - multipart/form-data
      description: 上传数据项图片
      parameters:
      - description: 表单文件对象
        in: formData
        name: file
        required: true
        type: file
      - description: 所属数据集ID
        in: formData
        name: datasetId
        required: true
        type: integer
      - description: 所属数据项ID
        in: formData
        name: datasetItemId
        required: true
        type: integer
      - description: 图片类型
        in: formData
        name: type
        required: true
        type: string
      - description: 图片描述
        in: formData
        name: description
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ImageFileInfo'
              type: object
      summary: 上传数据项图片
      tags:
      - 数据集项接口
    put:
      consumes:
      - application/json
      description: 修改数据项图片信息
      parameters:
      - description: 数据项文件ID
        in: query
        name: itemFileId
        required: true
        type: integer
      - description: 图片类型
        in: query
        name: type
        required: true
        type: string
      - description: 图片描述
        in: query
        name: description
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ImageFileInfo'
              type: object
      summary: 修改数据项图片信息
      tags:
      - 数据集项接口
  /api/v1/dataset/item:
    delete:
      consumes:
      - application/json
      description: 删除数据项
      parameters:
      - description: 数据项ID
        in: query
        name: datasetItemId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 删除数据项
      tags:
      - 数据集项接口
    post:
      consumes:
      - application/json
      description: 新增数据项
      parameters:
      - description: 所属数据集ID
        in: query
        name: datasetId
        required: true
        type: integer
      - description: 名称
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  format: int64
                  type: integer
              type: object
      summary: 新增数据项
      tags:
      - 数据集项接口
    put:
      consumes:
      - application/json
      description: 修改数据项
      parameters:
      - description: 数据项ID
        in: query
        name: datasetItemId
        required: true
        type: integer
      - description: 名称
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 修改数据项
      tags:
      - 数据集项接口
  /api/v1/dataset/operations/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: 批量删除请求
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 批量删除数据集
      tags:
      - 数据集操作
  /api/v1/dataset/operations/items:
    post:
      consumes:
      - application/json
      parameters:
      - description: 创建请求
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 创建数据项并上传配对图片
      tags:
      - 数据集操作
  /api/v1/dataset/operations/items/{itemId}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: 数据项ID
        in: path
        name: itemId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 级联删除数据项
      tags:
      - 数据集操作
  /api/v1/dataset/operations/items/batch:
    post:
      consumes:
      - application/json
      parameters:
      - description: 批量创建请求
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
