# 测试环境配置文件
zap:
  level: error
  format: console
  prefix: '[dehaze-go-test]'
  directory: logs
  show-line: false
  encode-level: LowercaseColorLevelEncoder
  stacktrace-key: stacktrace
  log-in-console: false
  retention-day: 30

# system configuration
system:
  port: 8990
  use-multi-point: false
  # IP限制次数 一个小时100000次（测试环境调大，避免集成测试触发限流）
  ip-limit-count: 100000
  #  IP限制一个小时
  ip-limit-time: 3600
  # 登录/注册接口 IP 限流次数（每分钟），测试环境调大避免集成测试触发限流
  login-ip-limit-count: 1000
  # 优惠券领取限流（测试环境调高避免集成测试触发）
  coupon-receive-rate-limit: 10000
  coupon-receive-rate-window: 60
  #  路由全局前缀
  router-prefix: ""

captcha:
  length: 6
  width: 240
  height: 80
  retry-count: 0 # 0代表无限制次数，大于0代表最多获取几次验证码
  timeout: 3600 # retry-count大于0时才生效，表示解除验证码限制时间

db:
  driver: mysql
  type: mysql
  mysql:
    host: ${DEHAZE_HOST}
    port: 3306
    database: dehaze_test
    username: root
    password: ${DEHAZE_PASSWORD}
    config: "charset=utf8mb4&parseTime=True&loc=Local"
    charset: utf8mb4
    parse-time: true
    loc: Local
  postgres:
    host: ${DEHAZE_HOST}
    port: 5432
    database: dehaze
    username: postgres
    password: ""
  sqlite:
    path: ./data/dehaze.db
  max-idle-conns: 10
  max-open-conns: 100
  singular: true
  log-mode: info
  log-zap: true

jwt:
  key: SecretKey012345678901234567890123456789012345678901234567890123456789
  ttl: 7200

session:
  cookie:
    secure: false
    path: /


mongo:
  uri: "mongodb://root:${DEHAZE_PASSWORD}@${DEHAZE_HOST}:27017/dehaze_test?authSource=admin"
  database: "dehaze_test"

cache:
  # 缓存类型：redis/local/multi
  type: redis
  redis:
    enabled: true
    addr: ${DEHAZE_HOST}:6379
    password: "${DEHAZE_PASSWORD}"
    # Redis db 隔离规范（推荐配置，不强制分库以避免破坏现有 Session）：
    #   db=0 业务缓存
    #   db=1 Session + 分布式锁（需后续迁移）
    #   db=2 限流计数器
    # 测试环境使用 db=4 与开发环境（db=0）隔离
    db: 4
    useCluster: false
    timeout: 5
  local:
    defaultExpire: 7200
    maxSize: 1000
    enabled: false
  fallback:
    enabled: true
    type: local
    maxRetries: 3
    retryDelay: 100

# XXL-Job 定时任务配置（测试环境禁用）
xxljob:
  enabled: false
  server-addr: ""
  access-token: ""
  executor-port: "9997"
  registry-key: "xxl-job-executor-dehaze-go"
