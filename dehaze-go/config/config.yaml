captcha:
  length: 4
  width: 120
  height: 40
  retry-count: 0 # 0代表无限制次数，大于0代表最多获取几次验证码
  timeout: 3600 # retry-count大于0时才生效，表示解除验证码限制时间

jwt:
  key: ${JWT_SECRET_KEY}
  ttl: 7200
  refresh-token-ttl: 604800 # RefreshToken 过期时间（秒），7天

session:
  cookie:
    secure: false # 开发环境 HTTP，Secure 必须为 false 否则浏览器丢弃 Cookie
    path: / # 开发环境 Vite 代理前缀为 /java-api，Path=/api 无法匹配，需用 /

db:
  driver: mysql
  type: mysql
  mysql:
    host: 127.0.0.1
    port: 3306
    database: dehaze
    username: root
    password: ${DEHAZE_PASSWORD}
    config: "charset=utf8mb4&parseTime=True&loc=Local"
    charset: utf8mb4
    parse-time: true
    loc: Local
  postgres:
    host: 127.0.0.1
    port: 5432
    database: dehaze
    username: postgres
    password: ""
  sqlite:
    path: ./data/dehaze.db
  max-idle-conns: 10
  max-open-conns: 100
  singular: true
  log-mode: info
  log-zap: true

cache:
  # 缓存类型（仅供参考）：实际后端选择由 redis.enabled / local.enabled 决定，
  # multiLevel.enabled 控制是否启用多级缓存。此字段不影响运行时行为。
  type: multi
  redis:
    enabled: true
    addr: 127.0.0.1:6379
    password: ${DEHAZE_PASSWORD}
    db: 0
    useCluster: false
    timeout: 5
    poolSize: 20
  local:
    defaultExpire: 7200
    maxSize: 1000
    enabled: true
  fallback:
    enabled: true
    type: local
    maxRetries: 3
    retryDelay: 100
  # 多级缓存配置（L1 本地 + L2 Redis）
  multiLevel:
    enabled: true
    l1ExpireSeconds: 300        # L1 本地缓存默认 5 分钟
    l2ExpireSeconds: 3600       # L2 Redis 缓存默认 1 小时
    asyncWriteBack: true
    l1MaxSize: 1000
    randomExpireRange: 60       # 过期时间随机抖动 60 秒，防雪崩
  # 缓存防护配置
  protection:
    bloomFilter:
      enabled: false            # 灰度策略：暂不启用，观察 L1+SingleFlight 效果后再启用
      expectedItems: 10000
      falsePositiveRate: 0.01
    singleFlight:
      enabled: true             # 启用 SingleFlight 防缓存击穿
    circuitBreaker:
      enabled: false            # 灰度策略：暂不启用
      maxRequests: 3
      interval: 60
      timeout: 30
      failureThreshold: 5
    nullCache:
      enabled: true             # 启用空值缓存防穿透
      expireSeconds: 60
  pubsub:
    enabled: true
    channel: "cache:invalidation"
    senderId: "pod-1"
    maxConcurrency: 32  # 可选，默认16

algorithm:
  serviceUrl: "http://127.0.0.1:8991" # Python 算法服务地址
  timeout: 120 # 请求超时（秒）
  connectTimeout: 5 # 连接超时（秒）
  apiKey: "dhak_m2m_internal_python_service_key_2024" # 服务间调用 API Key（M2M 认证）
  # 重试配置（指数退避）
  maxRetry: 3 # 最大重试次数（0 表示不重试）
  retryBackoffMs: 1000 # 重试初始退避（毫秒），指数增长
  # 熔断器配置
  circuitBreaker:
    enabled: true
    failureThreshold: 5 # 失败次数阈值，达到后熔断
    timeout: 30 # 熔断超时（秒），超时后进入半开状态
    maxRequests: 3 # 半开状态下允许的最大请求数

rabbitmq:
  enabled: true
  url: "amqp://root:${DEHAZE_PASSWORD}@127.0.0.1:5672/%2F"
  exchange: "dehaze.tasks"
  exchangeType: "direct"
  routingKeyPrefix: "task"

file:
  type: minio # 存储类型：minio/local
  baseUrl: "http://127.0.0.1:8990/api/v1/files/download" # 文件访问基础URL
  maxSize: 104857600 # 单文件最大大小（字节），默认100MB
  minio:
    endpoint: "127.0.0.1:9110"
    accessKey: "admin"
    secretKey: "${DEHAZE_PASSWORD}"
    bucketName: "dehaze"
  local:
    uploadPath: "./data/upload"

kafka:
  enabled: false
  brokers:
    - "localhost:9092"
  topic: "dehaze.logs"
  clientId: "dehaze-go"
