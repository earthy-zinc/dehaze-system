zap:
  level: info
  format: console
  prefix: "[dehaze-go]"
  directory: log
  show-line: true
  encode-level: LowercaseColorLevelEncoder
  stacktrace-key: stacktrace
  log-in-console: true
  retention-day: -1

# system configuration
system:
  port: 8990
  use-multi-point: false
  # IP限制次数 一个小时15000次
  ip-limit-count: 15000
  #  IP限制一个小时
  ip-limit-time: 3600
  #  路由全局前缀
  router-prefix: ""

